openapi: 3.0.3

info:
  title: CatalogoSSU to EnteTerzo

  version: 1.0.0

  description: |-
    API rese disponibili da Catalogo SSU alle componenti EnteTerzo

  contact:
    name: AgID - Agenzia per l'Italia Digitale
    url: https://www.agid.gov.it/

  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/

servers:
  - url: https://<system host+subdomains>.it
    description: Catalogo SSU to EnteTerzo SUAP endpoint

paths:
  /instance_descriptor/{cui_uuid}:
    description: Recupero descrittore istanza
    get:
      parameters:
        - name: cui_uuid
          in: path
          description: UUID del CUI
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OKInstanceDescriptor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []
  /administration_ghost/{fiscal_code}/{cui_uuid}:
    description: Recupero amminstrazione ghost
    get:
      parameters:
        - name: cui_uuid
          in: path
          description: UUID del CUI
          required: true
          schema:
            type: string
        - name: fiscal_code
          in: path
          description: fiscal_code ente
          required: true
          schema:
            type: string
            
      responses:
        "200":
          $ref: "#/components/responses/OKAdministrationGhost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
            description: risorsa non trovata
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []          

  /audit:
    description: Audit azioni realizzate dalle componenti
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditMessage"
        required: true

      responses:
        "200":
          $ref: "#/components/responses/OKAuditResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []
  /add_interested_administration:
    description: Aggiunge una lista di amministrazioni interessate
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/addInterestedAdministrationRequest"
        required: true
      responses:
        "200":
          description: Singola amministrazione aggiunta con successo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestedAdministrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - bearerAuth: []
          Agid-JWT-Signature: []


components:
  responses:
    OKInstanceDescriptor:
      description: "Instance Descriptor"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InstanceDescriptor"
      headers:
        Agid-JWT-Signature:
          $ref: "#/components/headers/Agid-JWT-Signature"
    OKRequest:
      description: Richiesta completata con successo
      headers:
        Agid-JWT-Signature:
          $ref: "#/components/headers/Agid-JWT-Signature"
    
    OKAuditResponse:
      description: Richiesta di Audit completata con successo
      headers:
        Agid-JWT-Signature:
          $ref: "#/components/headers/Agid-JWT-Signature"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuditResponse"
    OKAdministrationGhost:
      description: Richiesta recuperPec amminstrazione Ghost conclusa con successo
      headers:
        Agid-JWT-Signature:
          $ref: "#/components/headers/Agid-JWT-Signature"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdministrationGhost"

    BadRequest:
      description: Forma della richiesta non conforme alla specifica
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        Agid-JWT-Signature:
          $ref: "#/components/headers/Agid-JWT-Signature"
    ServiceUnavailable:
      description: Servizio non disponibile
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        Agid-JWT-Signature:
          $ref: "#/components/headers/Agid-JWT-Signature"

    Unauthorized:
      description: Richiesta non autorizzata
      headers:
        Agid-JWT-Signature:
          $ref: "#/components/headers/Agid-JWT-Signature"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    
    NotFound:
      description: risorsa non trovata
      headers:
        Agid-JWT-Signature:
          $ref: "#/components/headers/Agid-JWT-Signature"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
            
    ServerError:
      description: Errore processamento richiesta
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        Agid-JWT-Signature:
          $ref: "#/components/headers/Agid-JWT-Signature"


  schemas:
    cui:
      type: object
      description: codice unico dell'istanza
      required:
          - context
          - sub_context
          - data
          - progressivo
          - uuid
      properties:
          context:
              title: contesto dell'istanza
              type: string
          
          sub_context:
              title: Specificità del contesto (es. SUE Produttivo, SUE Residenziale)
              type: string

          data:
              title: data emissione cui
              type: string
              format: date
          
          progressivo:
              title: numero progressivo a rotazione annuale
              type: string

          uuid:
              title: UUID chiave del CUI
              type: string
    Error:
      type: object
      description: codice e descrizione condizione di errore
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    AuditMessage:
      type: object

      required:
        - cui
        - message
        - event_time
    
      properties:
        cui:
          $ref: "#/components/schemas/cui"

        message:
          type: string
          pattern: ^instance_retrived|integration_requested_from_(?:GHS)?[0-9]{1,10}|instance_integrated_retrived|suspension_requested_from_(?:GHS)?[0-9]{1,10}|conformation_requested_from_(?:GHS)?[0-9]{1,10}|cdss_requested_from_(?:GHS)?[0-9]{1,10}|positive_outcome_sended_from_(?:GHS)?[0-9]{1,10}|retry_requested_for_send_instance|retry_requested_for_notify|retry_requested_for_send_conclusions|retry_requested_for_request_cdss|retry_requested_for_request_integration|retry_requested_for_send_conformation|negative_outcome_sended_from_(?:GHS)?[0-9]{1,10}|instance_conformated_retrieved|conditional_provision_granted_from_[0-9]{1,10}|conditional_provision_extended_from_[0-9]{1,10}|conditional_provision_rescinded_from_[0-9]{1,10}|conditional_provision_denied_from_[0-9]{1,10}|existence_of_impediments_from_[0-9]{1,10}|cdss_convened_from_[0-9]{1,10}|cdss_requested_from_[0-9]{1,10}|communication_sended_from_(?:GHS)?[0-9]{1,10}|reopen_proceeding_documents_received|cdss_convocation_received|cdss_resolution_retrieved|cdss_resolution_update_retrieved|positive_cds_preliminary_resolution_sent_from_(?:GHS)?[0-9]{1,10}|negative_cds_preliminary_resolution_sent_from_(?:GHS)?[0-9]{1,10}|integration_requested_with_new_document_to_<Usecase_Proceding_Code>_from_<ET>|conformation_requested_with_new_document_to_<Usecase_Proceding_Code>_from_<ET>$

        event_time:
          title: timestamp del momento in cui si è verificato l'evento
          type: string
          format: date-time

    AuditResponse:
      type: object
      description: risposta audit
      required:
        - type
      properties:
        type:
          title: tipo messaggio
          type: string
          enum:
            - ok
            - out_of_flow
            - expected_time_exceeded
        message:
          title: messaggio
          type: string
    AdministrationGhost:
      type: object
      description: risposta AdministrationGhost
      required:
        - cui_uuid
      properties:
        cui_uuid:
          title: tipo messaggio
          type: string
        fiscal_code:
          title: messaggio
          type: string
        pec:
          title: messaggio
          type: string
    Times:
      description: tempi amministrativi dell'istanza
      type: object
      required:
      - start
      - max_gg_proc
      properties:
        start:
          title: data avvio dell'istanza
          type: string
          format: date
        max_gg_proc:          
          title: numero di giorni limite a partire da start entro cui l'istanza deve concludersi
          type: integer
          format: int32
        max_gg_correction_req:
          title: numero di giorni limite a partire da start per l'inoltro della richiesta di correzione a valle di un controllo formale
          type: integer
          format: int32
        max_gg_correction:
          title: numero di giorni limite a partire da start per la correzione a valle di un controllo formale
          type: integer
          format: int32
        max_gg_admissibility:          
          title: numero di giorni limite a partire da start per la verifica di ammissibilità
          type: integer
          format: int32
        max_gg_int_req:          
          title: numero di giorni limite a partire da start per la richiesta di integrazione degli enti terzi
          type: integer
          format: int32
        max_gg_int_resp:          
          title: numero di giorni limite a partire da start per integrazione del soggetto presentatore
          type: integer
          format: int32
        max_gg_conf_req:          
          title: numero di giorni limite a partire da start per la richiesta di conformazione degli enti terzi
          type: integer
          format: int32
        max_gg_conf_resp:          
          title: numero di giorni limite a partire da start per conformazione del soggetto presentatore
          type: integer
          format: int32
        max_gg_concl_send:          
          title: numero di giorni limite a partire da start per inoltro delle conclusioni degli enti terzi
          type: integer
          format: int32
        max_gg_cds_pre_req:          
          title: numero di giorni limite a partire da start entro cui può essere richiesta la conferenza di servizi preliminare
          type: integer
          format: int32
        max_gg_cds_istr_req:          
          title: numero di giorni limite a partire da start entro cui gli enti terzi possono richiedere conferenza di servizi istruttoria
          type: integer
          format: int32
        max_gg_cds_dec_req:          
          title: numero di giorni limite a partire da start entro cui gli enti terzi possono richiedere conferenza di servizi decisoria
          type: integer
          format: int32
        max_gg_cdss_req:          
          title: numero di giorni limite a partire da start entro cui gli enti terzi possono richiedere conferenza di servizi sincrona
          type: integer
          format: int32
        max_gg_inspection:          
          title: numero di giorni limite a partire da start entro cui gli enti terzi possono effettuare un'ispezione e inviare il relativo esito
          type: integer
          format: int32
        max_gg_prov_cond_ext_req:          
          title: numero di giorni limite a partire da start entro cui gli enti terzi possono effettuare una richiesta di proroga per il provvedimento condizionato 
          type: integer
          format: int32
        date_cdss:
          title: data evetuale conferenza di servizi sincrona
          type: string
          format: date

    AdministrationSchema:
      description: Amministrazione compentente censita nel Catalogo SSU
      type: object
      required:
        - ipacode
        - officecode
        - version
        - description
      properties:
        ipacode:
          title: codice IPA dell'amministrazione
          type: string
          minLength: 1
        officecode:
          title: codice dell'ufficio dell'amministrazione 
          type: string
          minLength: 1
        version:
          title: versione dell'ufficio dell'amministrazione 
          type: string
          pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"
        description:
            title: descrizione dell'amministrazione
            type: string
            
    InterestedAdministrationSchema:
      description: Un array di amministrazioni interessate.
      type: array
      items:
        type: object
        description: Amministrazione censita nel Catalogo SSU
        required:
          - description
          - ipacode
          - officecode
          - id
        properties:
          ipacode:
            title: codice IPA dell'amministrazione
            type: string
            minLength: 1
          officecode:
            title: codice dell'ufficio dell'amministrazione
            type: string
            minLength: 1
          version:
            title: versione dell'ufficio dell'amministrazione valorizzata solo se non è un amministrazione GHOST
            type: string
            pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"
          description:
            title: descrizione dell'amministrazione
            type: string
          id:
            title: identificativo dell'amministrazione
            type: string
            minLength: 1

    InterestedAdministrationCFSchema:
      description: Un array di amministrazioni interessate non censite su ipa.
      type: array
      items:
        type: object
        description: Amministrazione censita nel Catalogo SSU
        properties:
          fiscal_code:
            title: codice fiscale  dell'amministrazione non presente su IPA
            type: string
            minLength: 1
          description:
            title: descrizione dell'amministrazione
            type: string
          id:
            title: identificativo dell'amministrazione
            type: string
            minLength: 1

    InstanceDescriptor:
      description: descrittore istanza
      type: object
      required:
      - version
      - municipality
      - usecase_proceedings
      - instance_status
      - times
      - workflow
      properties:
        version:          
          title: numero versione del descrittore
          type: string
        
        cui:          
          "$ref": "#/components/schemas/cui"

        related_uuid:
          title: UUID chiave del CUI del procedimento dipendente relativo allo studio di fattibilità
          type: string
        
        municipality:          
          title: codice istat 6 cifre del comune in cui l'istanza è stata presentata
          type: string
          pattern: "^[0-9]{6}$"        
        
        legal_person:          
          title: codice fiscale persona giuridica
          type: string
          pattern: "^[0-9]{11}|^[A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$"
        
        instance_status:          
          title: stato dell'istanza
          type: array
          items:
            type: object
            required:
            - state
            - timestamp
            properties:
              state:                
                title: stato dell'istanza, stato iniziale da impostare in started
                type: string
                enum:
                - started
                - presented
                - correction_requested
                - corrected 
                - refused
                - integration_requested
                - ended_by_integration_times_expired
                - integrated
                - conformation_requested
                - ended_by_conformation_times_expired
                - conformated
                - cdss_convened
                - cdsa_convened
                - instance_transferred
                - ended_by_suspension_requested
                - ended_by_proceeding_time_expired
                - ended_by_positive_outcome
                - ended_by_negative_outcome
                - ended_by_submitter_cancel_requested
                
              timestamp:                
                title: timestamp del cambiamento di stato
                type: string
                format: date-time
        
        times:          
          $ref: "#/components/schemas/Times"  
        
        workflow:          
          type: object
          title: workflow del regime amministrativo dell'istanza          
          
          required:
            - id
            - version
          properties:
            id:              
              title: identificativo univoco del workflow del regime amministrativo
              type: string
              enum:
               - SCIA
               - AUTORIZZAZIONE
               - PROVVEDIMENTO-CONDIZIONATO
               - SCIA-CONDIZIONATA
               - CERS
               
            version:              
              title: version del workflow del regime amministrativo
              type: string
              pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"
        
        usecase_proceedings:          
          title: fattispecie procedimenti avviati
          type: array
          items:
            type: object
            required:
            - code
            - version
            - competent_administration
            - instance
            properties:
              code:                
                title: codice della fattispecie presente nel Catalogo
                type: string
                minLength: 1
              version:                
                title: versione della fattispecie presente nel Catalogo
                type: string
                minLength: 1
              competent_administration:                
                title: amministrazione competente del procedimento
                $ref: "#/components/schemas/AdministrationSchema"
              interested_administration:                
                title: amministrazione interessata al procedimento
                $ref: "#/components/schemas/InterestedAdministrationSchema"
              interested_administration_fiscal_code:                
                title: amministrazione ghost interessata al procedimento
                $ref: "#/components/schemas/InterestedAdministrationCFSchema"              
              form:                
                title: riferimento agli oggetti per la validazione
                type: object
                required:
                - xsd
                properties:
                  xsd:                    
                    title: xsd per la validazione
                    type: object
                    required:
                    - code
                    - version
                    properties:
                      code:                        
                        title: codice dell'XSD per la validazione
                        type: string
                        minLength: 1
                      version:                        
                        title: versione dell'XSD per la validazione
                        type: string
                        minLength: 1
                  schematron:                    
                    title: schematron per la validazione
                    type: object
                    required:
                    - code
                    - version
                    - phase
                    properties:
                      code:                        
                        title: codice dello schematron per la validazione
                        type: string
                        minLength: 1
                      version:                        
                        title: versione dello schematron per la validazione
                        type: string
                        minLength: 1
                      phase:                        
                        title: fasi dello schematron per la validazione
                        type: array
                        items:
                          type: string
              instance:                
                title: porzione istanza relativa al procedimento
                type: object
                required:
                - ref
                - hash
                - alg_hash
                properties:
                  ref:                    
                    title: riferimento all'elemento dell'istanza relativo al procedimento
                    type: string
                    minLength: 1
                  filename:                      
                      title: filename dell'istanza
                      type: string
                      minLength: 1
                  hash:                    
                    title: hash dell'istanza relativo al procedimento
                    type: string
                    minLength: 1
                  alg_hash:                    
                    title: algoritmo hash dell'istanza relativo al procedimento
                    type: string
                    enum:
                    - S256
                    - S384
                    - S512
                  code:
                    title: identificativo dell'allegato presente nel Catalogo
                    type: string
                    minLength: 1
                  version:
                    title: versione dell'allegato presente nel Catalogo
                    type: string
                    minLength: 1                    
                  mime_type:
                    type: string
                    enum: 
                       - application/xml
                       - application/pkcs7-mime
                  activity_model: 
                     title: porzione distinta modello attivita
                     type: object
                     properties:
                        ref:                    
                          title: distinta modello attivita
                          type: string
                          minLength: 1
                        filename:                      
                            title: filename del modello distinta attivita
                            type: string
                            minLength: 1
                        hash:                    
                          title: hash del modello distinta attivita
                          type: string
                          minLength: 1
                        alg_hash:                    
                          title: algoritmo hash del modello distinta attivita
                          type: string
                          enum:
                          - S256
                          - S384
                          - S512
                        mime_type:
                          type: string
                          enum: 
                             - application/pdf
                             - application/pkcs7-mime
              attachments:                
                title: allegati all'istanza relativi al procedimento
                type: array
                items:
                  type: object
                  required:
                  - ref
                  - hash
                  - alg_hash
                  - mime_type
                  - description
                  properties:

                    ref:                      
                      title: riferimento all'allegato dell'istanza relativo al procedimento, definito sul Catalogo
                      type: string
                      minLength: 1
                    filename:                      
                      title: filename dell'allegato
                      type: string
                      minLength: 1
                    file_size:
                      description: dimensione del file
                      type: integer
                    hash:                      
                      title: hash dell'allegato
                      type: string
                      minLength: 1
                    alg_hash:                      
                      title: algoritmo hash dell'allegato 
                      type: string
                      enum:
                      - S256
                      - S384
                      - S512
                    attach_code:
                      title: identificativo dell'allegato presente nel Catalogo
                      type: string
                      minLength: 1
                    attach_version:
                      title: versione dell'allegato presente nel Catalogo
                      type: string
                      minLength: 1                      
                    description:                      
                      title: descrizione dell'allegato
                      type: string
                      minLength: 1  
                    form:                      
                      title: riferimento agli oggetti per la validazione
                      type: object
                      required:
                      - xsd
                      properties:
                        xsd:                          
                          title: xsd per la validazione
                          type: object
                          required:
                          - code
                          - version
                          properties:
                            code:                              
                              title: codice dell'XSD per la validazione
                              type: string
                              minLength: 1
                            version:                              
                              title: versione dell'XSD per la validazione
                              type: string
                              minLength: 1
                        schematron:                          
                          title: schematron per la validazione
                          type: object
                          required:
                          - code
                          - version
                          - phase
                          properties:
                            code:                              
                              title: codice dello schematron per la validazione
                              type: string
                              minLength: 1
                            version:                              
                              title: versione dello schematron per la validazione
                              type: string
                              minLength: 1
                            phase:                              
                              title: fasi dello schematron per la validazione
                              type: array
                              items:
                                type: string
                    mime_type:
                      type: string

              free_attachments:
                title: allegati liberi non mappati sul Catalogo, relativi alla fattispecie
                type: array
                items:
                  type: object
                  required:
                  - ref
                  - hash
                  - alg_hash
                  - mime_type
                  properties:
                    ref:
                      title: riferimento dell'allegato, definito liberamente dalla componente senza avere una corrispondenza sul Catalogo
                      type: string
                      minLength: 1
                    filename:
                      title: filename dell'allegato
                      type: string
                      minLength: 1
                    file_size:
                      description: dimensione del file.
                      type: integer
                    hash:
                      title: hash dell'allegato
                      type: string
                      minLength: 1
                    alg_hash:
                      title: algoritmo hash dell'allegato 
                      type: string
                      enum:
                      - S256
                      - S384
                      - S512
                    mime_type:
                      type: string    
        permit_document:
            type: object
            required:
            - ref
            - hash
            - alg_hash
            - mime_type
            - filename
            - file_size
            properties:
                ref:
                    title: riferimento dell'allegato
                    type: string
                    minLength: 1
                filename:
                    title: filename dell'allegato
                    type: string
                    minLength: 1
                file_size:
                    description: dimensione del file.
                    type: integer
                hash:
                    title: hash dell'allegato
                    type: string
                    minLength: 1
                alg_hash:
                    title: algoritmo hash dell'allegato 
                    type: string
                    enum:
                    - S256
                    - S384
                    - S512
                mime_type:
                    type: string
                revoked_document:
                    title: indica se il documento è stato revocato
                    type: boolean                    
    addInterestedAdministrationRequest:
      description: Richiesta per aggiungere un'amministrazione/ente interessato a un usecase
      type: object
      required:
        - cui
        - usecase
        - interested_administration
      properties:
        cui:
           $ref: "#/components/schemas/cui"
        interested_administration:
          description: Dettagli dell'amministrazione
          oneOf:
            - description: Amministrazione pubblica (ente con codice IPA)
              type: object
              properties:
                ipacode:
                  title: Codice IPA dell'amministrazione
                  type: string
                  example: "0123456789"
                officecode:
                  title: Codice ufficio/AOO dell'amministrazione
                  type: string
                  example: "ABCDE"
                description:
                  title: Descrizione dell'amministrazione
                  type: string
                  example: "Ministero dell'Innovazione"
              required:
                - ipacode
                - officecode
                - description
            - description: Ente non censito su IPA
              type: object
              properties:
                fiscal_code:
                  title: Codice fiscale dell'ente 
                  type: string
                  example: "ABCDE"
                pec:
                  title: Indirizzo PEC dell'ente 
                  type: string
                  format: email
                  example: "ente@pec.it"
                description:
                  title: Descrizione dell'ente
                  type: string
                  example: "Azienda XYZ"
              required:
                - fiscal_code
                - pec
                - description
    InterestedAdministrationResponse:
      type: object
      description: Contenitore della risposta per una singola amministrazione
      oneOf:
        - properties:
            administration_ipa:
              $ref: "#/components/schemas/InterestedAdministrationSingleSchema"
          required:
            - administration_ipa
        - properties:
            administration_noipa:
              $ref: "#/components/schemas/InterestedAdministrationCFSingleSchema"
          required:
            - administration_noipa

    # --- SCHEMI SINGOLI (Modificati da array a object) ---
    InterestedAdministrationSingleSchema:
      type: object
      description: Amministrazione censita nel Catalogo SSU (Singola)
      required:
        - description
        - ipacode
        - officecode
        - id
      properties:
        ipacode:
          title: codice IPA dell'amministrazione
          type: string
        officecode:
          title: codice dell'ufficio dell'amministrazione
          type: string
        version:
          title: versione dell'ufficio
          type: string
          pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"
        description:
          title: descrizione dell'amministrazione
          type: string
        id:
          title: identificativo dell'amministrazione
          type: string

    InterestedAdministrationCFSingleSchema:
      type: object
      description: Amministrazione non censita su IPA (Singola)
      required:
        - fiscal_code
        - description
        - id
      properties:
        fiscal_code:
          title: codice fiscale dell'amministrazione
          type: string
        description:
          title: descrizione dell'amministrazione
          type: string
        id:
          title: identificativo dell'amministrazione
          type: string

  headers:
    Agid-JWT-Signature:
      schema:
        format: JWS
        maxLength: 4096
        type: string
        example: eyJzd.fafa.fafafa
      description: |-
        Il valore di questo header è una token JWT firmato secondo la specifica JWS.
        Vedi Modi  [integrity_rest_02] Integrità del payload del messaggio REST.
        In ogni caso la versione del pattern di sicurezza da utilizzare è l'ultima versione indicata da PDND.

  securitySchemes:
    bearerAuth:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Implementazione conforme ad RFC8725

    Agid-JWT-Signature:
      type: apiKey
      description: |-
        Il valore di questo header è una token JWT firmato secondo la specifica JWS.
        Vedi Modi  [integrity_rest_02] Integrità del payload del messaggio REST.
        In ogni caso la versione del pattern di sicurezza da utilizzare è l'ultima versione indicata da PDND.
      name: Agid-JWT-Signature
      in: header
