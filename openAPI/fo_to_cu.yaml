openapi: 3.0.3

info:
    title: FrontOffice to ComUnica

    version: 1.0.0

    description: |-
        API rese disponibili da FrontOffice a ComUnica

    contact:
        name: AgID - Agenzia per l'Italia Digitale
        url: https://www.agid.gov.it/

    license:
        name: CC BY-NC-SA 4.0
        url: https://creativecommons.org/licenses/by-nc-sa/4.0/

servers:
    - url: https://<system host+subdomains>.it
      description: FrontOffice to ComUnica endpoint

paths:

    /fo-portal-ref:
        post:
            description: Recupero URL del portale del FO SUAP.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                municipality:
                                    title: codice istat 6 cifre del comune in cui l'istanza è stata presentata
                                    type: string
                                c_fiscale:
                                    title: codice fiscale
                                    type: string
                                instance_code_comunica:
                                    title: codice univoco pratica ComUnica
                                    type: string
            responses:
                "200":
                    $ref: "#/components/responses/FoPortalResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []
                          
    /retry:
        post:
            description: Richiesta di ritrasmissione dati relativi ad una specifica operation a causa di incoerenze riscontrate sui dati ricevuti.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                cui:
                                    $ref: "#/components/schemas/cui"
                                operation:
                                    description: operation per la quale si richiede la ritrasmissione
                                    type: string
                                    enum:
                                        - send_instance
                         
                                error:
                                    $ref: "#/components/schemas/Error"

            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /instance/{cui_uuid}/document/{resource_id}:
        get:
            description: |
                Recupero di una specifica risorsa (xml, documento digitale) in relazione a una data istanza di procedimento.

            parameters:
                - in: header
                  name: Range
                  description: Specifica l'intervallo di byte richiesto per il recupero parziale della risorsa.
                  required: false
                  schema:
                    type: string
                    example: bytes=0-999
                - in: header
                  name: If-Match
                  description: precondizione contenente l'hash della risorsa
                  required: true
                  schema:
                      type: string
                - name: cui_uuid
                  in: path
                  description: UUID del CUI
                  required: true
                  schema:
                      type: string
                - name: resource_id
                  in: path
                  description: id risorsa documento
                  required: true
                  schema:
                      type: string

            responses:
                "200":
                    description: risorsa richiesta, codificata in base64, il mime type relativo è specificato nel descrittore dell'istanza
                    content:
                        text/plain:
                            schema:
                                type: string
                                format: byte
                    headers:
                        Agid-JWT-Signature:
                            $ref: "#/components/headers/Agid-JWT-Signature"

                "206":
                    description: porzione di risorsa richiesta, codificata in base64, il mime type relativo è specificato nel descrittore dell'istanza
                    content:
                        text/plain:
                            schema:
                                type: string
                                format: byte
                    headers:
                        Content-Range:
                            description: espressione del range incluso nella risposta
                            schema:
                                type: string
                                example: bytes 21010-47021/47022
                        Agid-JWT-Signature:
                            $ref: "#/components/headers/Agid-JWT-Signature"

                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "412":
                    $ref: "#/components/responses/PreconditionFailed"
                "416":
                    $ref: "#/components/responses/RangeNotSatisfiable"
                "428":
                    $ref: "#/components/responses/PreconditionRequired"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /cancel_instance:
        description: richiesta di cancellazione di una data istanza di procedimento da parte del Soggetto Presentatore
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/cui"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []


    /notify_receipt:
        description: notifica invio ricevuta al Soggetto Presentatore
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - cui
                                - date
                                - comunica-cui
                                - comunica-cui-signed
                            properties:
                                cui:
                                    $ref: "#/components/schemas/cui"
                                date:
                                    type: string
                                    format: date
                                comunica-cui:
                                    $ref: "#/components/schemas/comunica-cui"
                                comunica-cui-signed:
                                    $ref: "#/components/schemas/comunica-cui-signed"
                               
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

components:
    responses:
        FoPortalResponse:
            description: Risposta url portale frontoffice
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/FOPortal"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
        OKRequest:
            description: Richiesta completata con successo
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        BadRequest:
            description: Forma della richiesta non conforme alla specifica
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
        
        NotFound:
            description: risorsa non trovata
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
        
        Conflict:
            description: conflitto sulla risorsa, la richiesta non può essere elaborata a causa di un conflitto nello stato coerente della risorsa
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
                
        PreconditionFailed:
            description: precondizione fallita, rappresentazione risorsa non correttamente individuata
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
        
        RangeNotSatisfiable:
            description: richiesta di range non soddisfacibile
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
                Content-Range:
                    description: lunghezza attuale della rappresentazione selezionata
                    schema:
                        type: string
                        example: bytes */47022

        PreconditionRequired:
            description: precondizione richiesta, rappresentazione risorsa non correttamente individuata
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        ServiceUnavailable:
            description: Servizio non disponibile
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        Unauthorized:
            description: Richiesta non autorizzata
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        ServerError:
            description: Errore processamento richiesta
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
    schemas:
        cui:
            type: object
            description: codice unico dell'istanza
            required:
                - context
                - sub_context
                - data
                - progressivo
                - uuid
            properties:
                context:
                    title: contesto dell'istanza
                    type: string
                sub_context:
                    title: Specificità del contesto (es. SUE Produttivo, SUE Residenziale)
                    type: string
                data:
                    title: data emissione cui
                    type: string
                    format: date
                
                progressivo:
                    title: numero progressivo a rotazione annuale
                    type: string

                uuid:
                    title: UUID chiave del CUI
                    type: string
                    
        comunica-cui: 
            type: object
            description: Distinta Comunica
            required:
                - file
                - filename
                - mime_type
            properties:
                file:
                    title: file distinta comunica
                    type: string
                    format: byte
                filename: 
                    title: nome del file distinta comunica
                    type: string
                file_size:
                    description: Dimensione del file.
                    type: integer
                mime_type: 
                    title: mime type della distinta comunica
                    type: string
                    enum:
                      - application/xml
                      - application/pkcs7-mime
        comunica-cui-signed:             
            type: object
            description: Distinta Comunica firmata
            required:
                - file
                - filename
                - mime_type
            properties:
                file:
                    title: file distinta comunica firmata
                    type: string
                    format: byte
                filename: 
                    title: nome del file distinta comunica firmata
                    type: string
                file_size:
                    description: Dimensione del file.
                    type: integer
                mime_type: 
                    title: mime type della distinta comunica firmata
                    type: string
                    enum:
                      - application/pdf
                      - application/pkcs7-mime
        FOPortal:
            type: object
            description: Url portale Frontoffice SUAP
            properties:
                url:
                    description: Url del portale frontoffice
                    type: string
                    example: foportal.it/xyz
                secretToken:
                    description: token segreto per identificazione del ComUnica da concatenare all'URL come path parameter ad esempio https://foportal.it/xyz/<secretToken>
                    type: string
        Error:
            type: object
            description: codice e descrizione condizione di errore
            properties:
                code:
                    type: string
                message:
                    type: string
            required:
                - code
                - message
      
                    

    headers:
        Agid-JWT-Signature:
            schema:
                format: JWS
                maxLength: 4096
                type: string
                example: eyJzd.fafa.fafafa
            description: |-
                Il valore di questo header è una token JWT firmato secondo la specifica JWS.
                Vedi Modi [integrity_rest_02] Integrità del payload del messaggio REST.
                In ogni caso la versione del pattern di sicurezza da utilizzare è l'ultima versione indicata da PDND.

    securitySchemes:
        bearerAuth:
            scheme: bearer
            bearerFormat: JWT
            type: http
            description: Implementazione conforme ad RFC8725

        Agid-JWT-Signature:
            type: apiKey
            description: |-
                Il valore di questo header è una token JWT firmato secondo la specifica JWS.
                Vedi Modi [integrity_rest_02] Integrità del payload del messaggio REST.
                In ogni caso la versione del pattern di sicurezza da utilizzare è l'ultima versione indicata da PDND.
            name: Agid-JWT-Signature
            in: header
