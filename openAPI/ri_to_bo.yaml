            additionalProperties: false
            required:
              - name
              - mime_type
              - resource_id
              - document_classification_coding
              - hash
              - alg_hash
            properties:
              name:
                type: string
                enum:
                  - RICEVUTA_XML
              mime_type:
                type: string
