openapi: 3.0.3

info:
    title: RegistroImprese to BackOffice SUAP

    version: 1.0.0

    description: |-
        API rese disponibili dal Registro Imprese a BackOffice SUAP

    contact:
        name: AgID - Agenzia per l'Italia Digitale
        url: https://www.agid.gov.it/

    license:
        name: CC BY-NC-SA 4.0
        url: https://creativecommons.org/licenses/by-nc-sa/4.0/

servers:
    - url: https://<system host+subdomains>.it
      description: RegistroImprese to BackOffice SUAP endpoint

paths:

    /send_instance:
        description: Inoltro dei riferimenti a un' istanza di procedimento.
 
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SendInstanceRequest"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavaliable"
            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []
  
    /notify:
        post:
            description: Notifica eventi di processo di una data istanza di procedimento.
            requestBody:
                content:
                    application/json:
                        schema:
                            oneOf:
                                - $ref: "#/components/schemas/NotifyMessage"
                                - $ref: "#/components/schemas/TransferOutcomeNotifyMessage"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavaliable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

components:
    responses:
        OKRequest:
            description: Richiesta completata con successo
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        BadRequest:
            description: Forma della richiesta non conforme alla specifica
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
        NotFound:
            description: risorsa non trovata
            headers:
              Agid-JWT-Signature:
                $ref: "#/components/headers/Agid-JWT-Signature"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"

        ServiceUnavaliable:
            description: Servizio non disponibile
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
        
        Unauthorized:
            description: Richiesta non autorizzata
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        
        ServerError:
            description: Errore processamento richiesta
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

    schemas:
        cui:
            type: object
            description: codice unico dell'istanza
            required:
                - context
                - data
                - progressive
                - uuid
            properties:
                context:
                    title: contesto dell'istanza
                    type: string
                data:
                    title: data emissione cui
                    type: string
                    format: date
                
                progressive:
                    title: numero progressivo a rotazione annuale
                    type: string

                uuid:
                    title: UUID chiave del CUI
                    type: string
        
        Tag:
            description: struttura oggetto Tag
            type: object
            required:
              - tag_key
              - tag_value
            properties:
              tag_key:
                title: Chiave del Tag di classificazione associato ad un documento
                type: string
                example: "SottoProcedimento"
              tag_value:
                title: Valore del Tag di classificazione associato ad un documento
                type: string
                example: "AUA"

        InstanceIndexFII:
            type: array
            description: indice istanza
            items:
                type: object
                required:
                - code
                - ref
                - description
                - resource_id
                - document_classification_coding
                - hash
                - alg_hash
                properties:
                    code:                            
                        title: codice della fattispecie presente nel Catalogo
                        type: string
                        minLength: 1
                    ref:                            
                        title: riferimento all'elemento dell'istanza relativo al procedimento
                        type: string
                        minLength: 1
                    description:                            
                        title: descrizione della risorsa
                        type: string
                        minLength: 1
                    filename:                      
                        title: filename della risorsa documento correlata all'evento notificato
                        type: string
                        minLength: 1
                    file_size:
                        description: Dimensione del file.
                        type: integer
                    mime_type:
                        type: string
                        enum: 
                            - application/pdf
                            - application/xml
                            - application/pkcs7-mime
                    resource_id:                            
                        title: id della risorsa, univoco per erogatore e CUI.UUID
                        type: string
                        minLength: 1
                    document_classification_coding:
                      title: Codifica della classificazione associata ad un documento
                      description: La classificazione viene recuperata dal Catalogo SSU, tuttavia, resta in capo al Back-Office la responsabilità di tale associazione e, qualora venga ritenuto opportuno, può ad ogni modo apportare una correzione. I valori ammissibili sono recuperabili al path catalogo-ssu_meta/document_classifications.
                      type: string
                      pattern: "C[0-9]{1,2}_[a-z]"
                    tags: 
                      description: Tag associati al documento.
                      type: array
                      items:
                          $ref: '#/components/schemas/Tag'
                    validity:
                      description: Validità del documento espressa in formato "date".
                      type: string
                      format: date
                    hash:                            
                        title: hash dell'elemento dell'istanza relativo al procedimento
                        type: string
                        minLength: 1
                    alg_hash:                                
                        title: algoritmo hash applicato
                        type: string
                        enum:
                        - S256
                        - S384
                        - S512
        
        GeneralIndexFII:
            type: array
            description: indice allegati trasversali
            minItems: 0
            uniqueItems: true
            items:
              anyOf:
