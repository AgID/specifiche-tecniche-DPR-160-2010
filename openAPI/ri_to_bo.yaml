                  type: string
                  pattern: "C2_[a-z]"
              tags: 
                  description: Tag associati al documento.
                  type: array
                  items:
                    $ref: '#/components/schemas/Tag'
              hash:
                  title: hash risorsa
                  type: string
                  minLength: 1
              alg_hash:
                  title: algoritmo hash applicato
                  type: string
                  enum:
                  - S256
                  - S384
                  - S512


