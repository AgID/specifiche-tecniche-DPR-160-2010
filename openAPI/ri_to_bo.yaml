                - $ref: '#/components/schemas/suap_rea_start_xml_fii'
                - $ref: '#/components/schemas/suap_rea_update_xml_fii'
                - $ref: '#/components/schemas/comunica_cui_xml_fii'
                - $ref: '#/components/schemas/comunica_cui_pdf_fii'

