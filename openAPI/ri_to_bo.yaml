            properties:
                code:
                    type: string
                message:
                    type: string
            required:
                - code
                - message
        
        SendInstanceRequest:
            required:
                - cui
                - instance_descriptor_version
                - c_fiscale_impresa
                - instance_index_fii
                - general_index_fii
            type: object
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                c_fiscale_impresa:
                    description: Codice fiscale dell'impresa
                    type: string
                instance_index_fii:
                    $ref: "#/components/schemas/InstanceIndexFII"
                general_index_fii:
                    $ref: "#/components/schemas/GeneralIndexFII"
                receiver_administration:
                    title: amministrazione destinataria delle istanze
                    $ref: "#/components/schemas/AdministrationSchema"
        
        AdministrationSchema:
            description: Amministrazione compentente censita nel Catalogo SSU
            type: object
            required:
                - ipacode
                - officecode
                - version
                - description
            properties:
                ipacode:
                    title: codice IPA dell'amministrazione
                    type: string
                    minLength: 1
                officecode:
                    title: codice dell'ufficio dell'amministrazione 
                    type: string
                    minLength: 1
                version:
                    title: versione dell'ufficio dell'amministrazione 
                    type: string
                    pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"
                description:
                    title: descrizione dell'amministrazione
                    type: string

        NotifyMessage:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - event
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                event:
                    type: string
                    enum:
                        - end_by_instance_refused
                        - end_by_proceeding_time_expired
                        - end_by_integration_times_expired
                        - end_by_conformation_times_expired
                        - end_by_submitter_cancel_requested
                resource_rea_end:
                    $ref: "#/components/schemas/suap_rea_end_fii"      
                        
        TransferOutcomeNotifyMessage:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - event
                - c_fiscale_impresa
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                event:
                    type: string
                    enum:
