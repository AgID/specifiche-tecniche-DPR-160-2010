                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                event:
                    type: string
                    enum:
                        - cdss_convened
        
        CdssNotifyMessage:
            allOf:
              - $ref: "#/components/schemas/NotifyMessage"
              - type: object
                required:
                    - cdss_channel
                    - cdss_convocation
                properties:
                    filename:                      
                        title: filename dell'atto amministrativo
                        type: string
                        minLength: 1
                    mime_type:
                        title: "indica il formato dei dati previsto per l'atto amministrativo"
                        type: string
                        minLength: 1
                    resource_id:
                        title: se presente, id della risorsa documento correlata all'evento notificato
                        type: string
                        minLength: 1
                    file_size:
                        description: Dimensione del file.
                        type: integer
                    hash:
                        title: hash risorsa
                        type: string
                        minLength: 1
                    alg_hash:
                        title: algoritmo hash applicato
                        type: string
                        enum:
                        - S256
                        - S384
                        - S512
                    cdss_channel:
                        type: string
