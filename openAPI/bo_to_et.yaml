openapi: 3.0.3

info:
    title: BackOffice SUAP to Ente Terzo SUAP

    version: 1.0.0

    description: |-
        API rese disponibili da BackOffice SUAP a Ente Terzo SUAP

    contact:
        name: AgID - Agenzia per l'Italia Digitale
        url: https://www.agid.gov.it/

    license:
        name: CC BY-NC-SA 4.0
        url: https://creativecommons.org/licenses/by-nc-sa/4.0/

servers:
    - url: https://<system host+subdomains>.it
      description: Ente Terzo SUAP to BackOffice SUAP endpoint

paths:
    /retry:
        post:
            description: Richiesta di ritrasmissione dati relativi ad una specifica operation a causa di incoerenze riscontrate sui dati ricevuti.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - cui
                                - requester_administration
                                - operation
                            properties:
                                cui:
                                    $ref: "#/components/schemas/cui"
                                operation:
                                    description: operation per la quale si richiede la ritrasmissione
                                    type: string
                                    enum:
                                        - send_instance
                                        - notify
                                requester_administration:
                                    title: amministrazione richiedente
                                    $ref: "#/components/schemas/AdministrationSchema"
                                error:
                                    $ref: "#/components/schemas/Error"

            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavaliable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []
    
    /send_impediments:
        description: Inoltro dei motivi ostativi relativi alle proprie istruttorie in relazione a una data instanza di procedimento
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/Impediments"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavaliable"
            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /send_conclusions:
        description: Inoltro delle conclusioni delle proprie istruttorie in relazione a una data instanza di procedimento
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SendConclusionRequests"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavaliable"
            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /send_conditional_provision:
        description: Inoltro del Provvedimento Condizionato
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ConditionalProvisionGranted"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavaliable"
            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /request_cdss:
        post:
            description: Richiesta convocazione Conferenza dei Servizi Sincrona (CdSS) in relazione a una data instanza di procedimento
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - cui
                                - requester_administration
                            properties:
                                cui: 
                                    $ref: "#/components/schemas/cui"
                                requester_administration:
                                    title: amministrazione richiedente
                                    $ref: "#/components/schemas/AdministrationSchema"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavaliable"
            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /request_integration:
        post:
            description: Richiesta integrazioni in relazione a una data instanza di procedimento
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/IntegrationRequest"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavaliable"
            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /request_conformation:
        post:
            description: Richiesta di conformazione in relazione a una data instanza di procedimento
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ConformationRequest"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavaliable"
            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /instance/{cui_uuid}/document/{resource_id}:
        get:
            description: | 
                Recupero di una specifica risorsa (xml, documento digitale) in relazione a una data istanza di procedimento.
                Le Range Request (RFC9110) sono supportate soltanto in modalità single part.
            
            parameters:
                - in: header
                  name: Range
                  description: Specifica l'intervallo di byte richiesto per il recupero parziale della risorsa (RFC 9110, single part).
                  required: false
                  schema:
                    type: string
                    example: bytes=0-999
                - in: header
                  name: If-Match
                  description: precondizione contenente l'hash della risorsa
                  required: true
                  schema:
                      type: string
                - name: cui_uuid
                  in: path
                  description: UUID del CUI
                  required: true
                  schema:
                      type: string
                - name: resource_id
                  in: path
                  description: id risorsa documento
                  required: true
                  schema:
                      type: string
                

            responses:
                "200":
                    description: risorsa richiesta, codificata in base64, il mime type relativo è specificato nel descrittore dell'istanza
                    content:
                        text/plain:
                            schema:
                                type: string
                                format: byte
                    headers:
                        Agid-JWT-Signature:
                            $ref: "#/components/headers/Agid-JWT-Signature"

                "206":
                    description: porzione di risorsa richiesta, codificata in base64, il mime type relativo è specificato nel descrittore dell'istanza
                    content:
                        text/plain:
                            schema:
                                type: string
                                format: byte
                    headers:
                        Content-Range:
                            description: espressione del range incluso nella risposta
                            schema:
                                type: string
                                example: bytes 21010-47021/47022
                        Agid-JWT-Signature:
                            $ref: "#/components/headers/Agid-JWT-Signature"

                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    description: risorsa non trovata
                    headers:
                        Agid-JWT-Signature:
                            $ref: "#/components/headers/Agid-JWT-Signature"
                "412":
                    description: precondizione fallita, rappresentazione risorsa non correttamente individuata
                    headers:
                        Agid-JWT-Signature:
                            $ref: "#/components/headers/Agid-JWT-Signature"
                "416":
                    description: richiesta di range non soddisfacibile
                    headers:
                        Agid-JWT-Signature:
                            $ref: "#/components/headers/Agid-JWT-Signature"
                        Content-Range:
                            description: espressione del range non soddisfacibile
                            schema:
                                type: string
                                example: bytes 21010-47021/47022
                "428":
                    description: precondizione richiesta, rappresentazione risorsa non correttamente individuata
                    headers:
                        Agid-JWT-Signature:
                            $ref: "#/components/headers/Agid-JWT-Signature"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavaliable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /notify:
        post:
            description: Notifica eventi di processo di una data istanza di procedimento.
            requestBody:
                content:
                    application/json:
                        schema:
                            oneOf:
                                - $ref: "#/components/schemas/CdssNotifyMessage"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavaliable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []
components:    
    responses:
        OKRequest:
            description: Richiesta completata con successo
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        BadRequest:
            description: Forma della richiesta non conforme alla specifica
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
        ServiceUnavaliable:
            description: Servizio non disponibile
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        Unauthorized:
            description: Richiesta non autorizzata
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        ServerError:
            description: Errore processamento richiesta
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

    schemas:
        cui:
            type: object
            description: codice unico dell'istanza
            required:
                - context
                - data
                - progressive
                - uuid
            properties:
                context:
                    title: contesto dell'istanza
                    type: string
                data:
                    title: data emissione cui
                    type: string
                    format: date
                
                progressive:
                    title: numero progressivo a rotazione annuale
                    type: string

                uuid:
                    title: UUID chiave del CUI
                    type: string

        AdministrationSchema:
            description: Amministrazione compentente censita nel Catalogo SSU
            type: object
            required:
                - ipacode
                - officecode
                - version
                - description
            properties:
                ipacode:
                    title: codice IPA dell'amministrazione
                    type: string
                    minLength: 1
                officecode:
                    title: codice dell'ufficio dell'amministrazione 
                    type: string
                    minLength: 1
                version:
                    title: versione dell'ufficio dell'amministrazione 
                    type: string
                    pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"
                description:
                    title: descrizione dell'amministrazione
                    type: string
                    
        Error:
            type: object
            description: codice e descrizione condizione di errore
            properties:
                code:
                    type: string
                message:
                    type: string
            required:
                - code
                - message

        IntegrationRequest:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - integration_list
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                integration_list:
                    type: array
                    items:
                        type: object
                        required:
                            - code
                            - ref
                            - integration_request
                        properties:
                            code:
                                title: codice della fattispecie presente nel Catalogo
                                type: string
                                minLength: 1
                            ref:
                                title: riferimento all'elemento dell'istanza relativo al procedimento (procedimento o allegato)
                                type: string
                                minLength: 1
                            integration_request:
                                title: elenco integrazioni richieste da uno o più enti terzi
                                type: array
                                items:
                                    type: object
                                    properties:
                                        request:
                                            title: testo integrazione richiesta
                                            type: string
                                        requester_administration:
                                            title: amministrazione richiedente
                                            $ref: "#/components/schemas/AdministrationSchema"

                integration_document_list:
                    type: array
                    items:
                        type: object
                        properties:
                            requester_administration:
                                title: amministrazione richiedente
                                $ref: "#/components/schemas/AdministrationSchema"
                            resource_id:
                                title: id della risorsa "documento di richiesta integrazioni", univoco per erogatore e CUI.UUID
                                type: string
                                minLength: 1
                            filename:                      
                                title: filename della risorsa "documento di richiesta integrazioni"
                                type: string
                                minLength: 1
                            file_size:
                                description: Dimensione del file.
                                type: integer
                            mime_type:
                                title: "indica il formato dei dati previsto per il documento di richiesta integrazioni"
                                type: string
                                minLength: 1
                            hash:
                                title: hash risorsa
                                type: string
                                minLength: 1
                            alg_hash:
                                title: algoritmo hash applicato
                                type: string
                                enum:
                                - S256
                                - S384
                                - S512

        ConformationRequest:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - expirationDate
                - conformation_list
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                expirationDate:
                        title: data di scadenza concessa al presentatore per inoltrare la documentazione relativa alla richiesta di conformazione
                        type: string
                        format: date
                conformation_list:
                    type: array
                    items:
                        type: object
                        required:
                            - code
                            - ref
                            - conformation_request
                        properties:
                            code:
                                title: codice della fattispecie presente nel Catalogo
                                type: string
                                minLength: 1
                            ref:
                                title: riferimento all'elemento dell'istanza relativo al procedimento (procedimento o allegato)
                                type: string
                                minLength: 1
                            conformation_request:
                                title: elenco conformazioni richieste da uno o più enti terzi
                                type: array
                                items:
                                    type: object
                                    properties:
                                        request:
                                            title: testo conformazione richiesta
                                            type: string
                                        requester_administration:
                                            title: amministrazione richiedente
                                            $ref: "#/components/schemas/AdministrationSchema"
                conformation_document_list:
                    type: array
                    items:
                        type: object
                        properties:
                            requester_administration:
                                title: amministrazione richiedente
                                $ref: "#/components/schemas/AdministrationSchema"
                            resource_id:
                                title: id della risorsa "documento di richiesta conformazione", univoco per erogatore e CUI.UUID
                                type: string
                                minLength: 1
                            filename:                      
                                title: filename della risorsa "documento di richiesta conformazione"
                                type: string
                                minLength: 1
                            mime_type:
                                title: "indica il formato dei dati previsto per il documento di richiesta conformazione"
                                type: string
                                minLength: 1
                            hash:
                                title: hash risorsa
                                type: string
                                minLength: 1
                            alg_hash:
                                title: algoritmo hash applicato
                                type: string
                                enum:
                                - S256
                                - S384
                                - S512
        
        Impediments:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - expiration_date
                - impediments
                - requester_administration
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                expiration_date:
                    type: string
                    description: "data di scadenza concessa al presentatore per inoltrare le osservazioni relative ai motivi ostativi"
                    format: date
                impediments:
                    type: string
                    minLength: 1
                requester_administration:
                    title: amministrazione richiedente
                    $ref: "#/components/schemas/AdministrationSchema"
                resource_id:
                    title: id della risorsa "documento di motivi ostativi", univoco per erogatore e CUI.UUID
                    type: string
                    minLength: 1
                filename:                      
                    title: filename della risorsa "documento di motivi ostativi"
                    type: string
                    minLength: 1
                mime_type:
                    title: "indica il formato dei dati previsto per il documento di motivi ostativi"
                    type: string
                    minLength: 1
                hash:
                    title: hash risorsa
                    type: string
                    minLength: 1
                alg_hash:
                    title: algoritmo hash applicato
                    type: string
                    enum:
                    - S256
                    - S384
                    - S512

        SendConclusionRequests:
            type: object
            oneOf:
                - $ref: "#/components/schemas/NegativeOutcome"
                - $ref: "#/components/schemas/PositiveOutcome"
                - $ref: "#/components/schemas/DefinitiveProvision"
                - $ref: "#/components/schemas/ConditionalProvisionRescinded"
                - $ref: "#/components/schemas/ConditionalProvisionDenied"

        NegativeOutcome:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - negative_outcome_motivation
                - conclusions_type
                - requester_administration
                - usecase_proceeding_list
            properties:
                conclusions_type:
                    type: string
                    enum: 
                    - suspension_requested
                    - suspension_requested_for_impediments
                    - negative_outcome
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                negative_outcome_motivation:
                    type: string
                    minLength: 1
                requester_administration:
                    title: amministrazione richiedente
                    $ref: "#/components/schemas/AdministrationSchema"
                resource_id:
                    title: id della risorsa "documento di esito negativo", univoco per erogatore e CUI.UUID
                    type: string
                    minLength: 1
                filename:                      
                    title: filename della risorsa "documento di parere negativo"
                    type: string
                    minLength: 1
                file_size:
                    description: Dimensione del file.
                    type: integer
                mime_type:
                    title: "indica il formato dei dati previsto per il documento di parere negativo"
                    type: string
                hash:
                    title: hash risorsa
                    type: string
                    minLength: 1
                alg_hash:
                    title: algoritmo hash applicato
                    type: string
                    enum:
                    - S256
                    - S384
                    - S512
                usecase_proceeding_list:
                    type: array
                    items:
                        type: string
                        title: codice della fattispecie presente nel Catalogo
                        minLength: 1

            example:
                conclusions_type: "negative_outcome"
                cui: 
                    context: "string"
                    data: "2024-07-10"
                    progressive: "string"
                    uuid: "string"
                instance_descriptor_version: "string"
                negative_outcome_motivation: "string"
                requester_administration: 
                    ipacode: "string"
                    officecode: "string"
                    version: "00.00.00"
                    description: "string"
                resource_id: "string"
                filename: "string"
                file_size: 1234
                mime_type: "string"
                hash: "string"
                alg_hash: "S256"
                

        PositiveOutcome:
            required:
                - cui
                - instance_descriptor_version
                - positive_outcome
                - conclusions_type
                - requester_administration
                - usecase_proceeding_list
            properties:
                conclusions_type:
                    type: string
                    enum: 
                    - positive_outcome
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                positive_outcome:
                    type: string
                    minLength: 1
                requester_administration:
                    title: amministrazione richiedente
                    $ref: "#/components/schemas/AdministrationSchema"
                resource_id:
                    title: id della risorsa "documento di parere positivo", univoco per erogatore e CUI.UUID
                    type: string
                    minLength: 1
                filename:                      
                    title: filename della risorsa "documento di parere positivo"
                    type: string
                    minLength: 1
                file_size:
                    description: Dimensione del file.
                    type: integer
                mime_type:
                    title: "indica il formato dei dati previsto per il documento di parere positivo"
                    type: string
                hash:
                    title: hash risorsa
                    type: string
                    minLength: 1
                alg_hash:
                    title: algoritmo hash applicato
                    type: string
                    enum:
                    - S256
                    - S384
                    - S512
                usecase_proceeding_list:
                    type: array
                    items:
                        type: string
                        title: codice della fattispecie presente nel Catalogo
                        minLength: 1
        
        ConditionalProvision:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - date
                - outcome
                - competent_administration
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                date:
                    type: string
                    format: date
                outcome:
                    type: string
                    enum: 
                        - conditional_provision_granted
                        - conditional_provision_denied
                        - conditional_provision_rescinded
                competent_administration:
                    title: amministrazione richiedente
                    $ref: "#/components/schemas/AdministrationSchema"
                resource_id:
                    title: id della risorsa associata all'esito del Provvedimento Condizionato, univoco per erogatore e CUI.UUID
                    type: string
                    minLength: 1
                filename:                      
                    title: filename dell'esito del Provvedimento Condizionato"
                    type: string
                    minLength: 1
                mime_type:
                    type: string
                    enum: 
                        - application/pdf
                        - application/pkcs7-mime
                hash:
                    title: hash risorsa
                    type: string
                    minLength: 1
                alg_hash:
                    title: algoritmo hash applicato
                    type: string
                    enum:
                    - S256
                    - S384
                    - S512
        
        DefinitiveProvision:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - date
                - outcome
                - competent_administration
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                date:
                    type: string
                    format: date
                outcome:
                    type: string
                    enum: 
                        - definitive_provision_granted
                competent_administration:

                    title: amministrazione richiedente
                    $ref: "#/components/schemas/AdministrationSchema"
                resource_id:
                    title: id della risorsa associata all'esito del Provvedimento Definitivo, univoco per erogatore e CUI.UUID
                    type: string
                    minLength: 1
                filename:                      
                    title: filename dell'esito del Provvedimento Definitivo"
                    type: string
                    minLength: 1
                mime_type:
                    type: string
                    enum: 
                        - application/pdf
                        - application/pkcs7-mime
                hash:
                    title: hash risorsa
                    type: string
                    minLength: 1
                alg_hash:
                    title: algoritmo hash applicato
                    type: string
                    enum:
                    - S256
                    - S384
                    - S512
        
        ConditionalProvisionGranted:
            allOf:
                - $ref: "#/components/schemas/DefinitiveProvision"
                - type: object
                  properties:
                    outcome:
                        type: string
                        enum: 
                            - conditional_provision_granted
        
        ConditionalProvisionDenied:
            allOf:
                - $ref: "#/components/schemas/DefinitiveProvision"
                - type: object
                  properties:
                    outcome:
                        type: string
                        enum: 
                            - conditional_provision_denied
        
        ConditionalProvisionRescinded:
            allOf:
                - $ref: "#/components/schemas/DefinitiveProvision"
                - type: object
                  properties:
                    outcome:
                        type: string
                        enum: 
                            - conditional_provision_rescinded


        NotifyMessage:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - event

            properties:
