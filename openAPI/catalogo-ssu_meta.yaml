openapi: 3.0.3

info:
  title: Catalogo SSU Metadata

  version: 1.0.0

  description: |-
    API rese disponibili dal Catalogo SSU alle componenti FrontOffice/BackOffice e Enti Terzi per la consultazione dei metadati

  contact:
    name: AgID - Agenzia per l'Italia Digitale
    url: https://www.agid.gov.it/

  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/

servers:
  - url: https://<system host+subdomains>.it
    description: Catalogo SSU Metadata endpoint

paths:
  /context:
    get:
      description: Recupero dei possibili valori del contesto di riferimento

      responses:
        "200":
          description: Elenco dei possibili valori del contesto di riferimento
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - code
                    - description
                    - sub_context
                  properties:
                    code:
                      title: contesto di riferimento
                      type: string
                    description:
                      title: descrizione del contesto di riferimento (es. ZES)
                      type: string
                    sub_context:
                      title: Specificità del contesto (es. ZES)
                      type: string

          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavaliable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []

      tags:
        - Context

  /typologies-lifeevents/{context}:
    get:
      description: Recupero elenco tipologie ed eventi della vita dei procedimenti
      parameters:
        - in: query
          name: typology
          description: paramentro di filtering sulla tipologia richiesta, non valorizzato per richiedere l'intero set
          required: false
          schema:
            type: string
        - name: lifeevent
          in: query
          description: paramentro di filtering su gli eventi della vita, non valorizzato per richiedere l'intero set
          required: false
          schema:
            type: string
        - name: municipality
          in: query
          description: paramentro di filtering sul comune richiesto, non valorizzato per richiedere l'intero set
          required: false
          schema:
            type: string
        - in: path
          name: context
          description: contesto di riferimento. I valori ammissibili sono reperibili invocando il path /context
          required: false
          schema:
            type: string
            default: "SUAP"

      responses:
        "200":
          description: Elenco delle tuple {typology,lifeevent,municipality} filtrato in base ai paramentri di richiesta
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - typology
                    - lifeevent
                    - municipality
                    - context
                  properties:
                    typology:
                      description: tipologia del procedimento (es. esercizio di vicinato, grande/media struttura di vendita)
                      type: string
                    lifeevent:
                      description: evento della vita relativo al procedimento (apertura, ampliamento, subingresso,etc.)
                      type: string
                    municipality:
                      description: identificativo del comune per cui la coppia  {typology,lifeevent} esiste per almeno un procedimento afferente afferente al comune
                      type: string
                    context:
                      description: contesto di riferimento (es. SUAP, SUE, ZES)
                      type: string

          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: risorsa non trovata
          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavaliable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []

      tags:
        - Lookup
  
  /administrative-regimes/{context}:
    get:
      description: Recupero elenco dei regimi amministrativi legati ad uno specifico contesto
      parameters:
        - in: query
          name: id
          description: paramentro di filtering sull'identificativo del regime amministrativo, se non valorizzato restituisce l'intero set
          required: false
          schema:
            type: string
        - in: query
          name: version
          description: paramentro di filtering sulla versione del regime amministrativo, se non valorizzato restituisce l'intero set
          required: false
          schema:
            type: string
        - in: path
          name: context
          description: contesto di riferimento. I valori ammissibili sono reperibili invocando il path /context
          required: true
          schema:
            type: string
            default: "SUAP"

      responses:
        "200":
          description: Elenco delle tuple {id, version, description, context} filtrato in base ai paramentri di richiesta
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - version
                    - description
                    - context
                  properties:
                    id:
                      description: identificativo del regime amministrativo nell'ambito del contesto (es. SCIA, AUTORIZZAZIONE, SILENZIO ASSENSO, COMUNICAZIONE)
                      type: string
                    version:
                      description: versione del regime amministrativo nell'ambito del contesto
                      type: string
                    description:
                      description: descrizione del regime amministrativo nell'ambito del contesto
                      type: string
                    context:
                      description: contesto di riferimento (es. SUAP, SUE, ZES)
                      type: string

          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: risorsa non trovata
          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavaliable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []

      tags:
        - Lookup

  /proceedings/{context}:
    get:
      description: Recupero elenco procedimenti per tipologia,evento della vita e comune (mapping su ambito territoriale)
      parameters:
        - in: query
          name: typology
          description: Recupero elenco procedimenti per tipologia, evento della vita, comune (mapping su ambito territoriale) e contesto di riferimento
          schema:
            type: string
        - name: lifeevent
          in: query
          description: Evento della vita relativo al procedimento (apertura, ampliamento, subingresso,etc.)
          schema:
            type: string
        - name: municipality
          in: query
          description: identificativo del comune necessario a determinare l'ambito territoriale del procedimento
          required: true
          schema:
            type: string
        - in: path
          name: context
          description: contesto di riferimento. I valori ammissibili sono reperibili invocando il path /context
          required: true
          schema:
            type: string
            default: "SUAP"

      responses:
        "200":
          description: Elenco dei procedimenti richiesti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proceeding"

          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavaliable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []

      tags:
        - Proceedings
 
  /proceeding/{proceeding_id}/{proceeding_version}/usecase-proceedings:
    get:
      description: Recupero elenco fattispecie (usecase-proceedings) di uno specifico procedimento
      parameters:
        - in: path
          name: proceeding_id
          description: id del procedimento
          required: true
          schema:
            type: string
        - name: proceeding_version
          in: path
          description: versione del procedimento
          required: true
          schema:
            type: string
            pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"

      responses:
        "200":
          description: Elenco delle fattispecie relative al procedimento richiesto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UseCaseProceeding"

          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavaliable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []

      tags:
        - Proceedings

  /proceeding/{proceeding_id}/{proceeding_version}/attachments:
    get:
      description: |
        Recupero elenco allegati di un procedimento

      parameters:
        - in: path
          name: proceeding_id
          description: id del procedimento
          required: true
          schema:
            type: string
        - name: proceeding_version
          in: path
          description: versione del procedimento
          required: true
          schema:
            type: string
            pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"

      responses:
        "200":
          description: Elenco degli allegati al procedimento richiesto
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object 
                  required:
                    - attachment
                    - mandatory
                  properties:
                    attachment:
                      $ref: "#/components/schemas/DocumentEntity"
                    mandatory:
                      type: boolean


          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavaliable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []

      tags:
        - Proceedings

  /proceeding/{proceeding_id}/{proceeding_version}/{municipality}/competent-administration:
    get:
      description: |
        Recupero amministrazione competente per uno specifico procedimento
      parameters:
        - in: path
          name: proceeding_id
          description: id del procedimento
          required: true
          schema:
            type: string
        - name: proceeding_version
          in: path
          description: versione del procedimento
          required: true
          schema:
            type: string
            pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"
        - name: municipality
          in: path
          description: identificativo del comune necessario a determinare l'amministrazione competente
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Amministrazione competente del procedimento richiesto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministrationSchema"

          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavaliable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []
      tags:
        - Proceedings

  /proceeding/{proceeding_id}/{proceeding_version}/form:
    get:
      description: |
        Recupero modulo digitale di uno specifico procedimento

      parameters:
        - in: path
          name: proceeding_id
          description: id del procedimento
          required: true
          schema:
            type: string
        - name: proceeding_version
          in: path
          description: versione del procedimento
          required: true
          schema:
            type: string
            pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"

      responses:
        "200":
          description: Modulo digitale di uno specifico procedimento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentEntity"

          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavaliable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []

      tags:
        - Proceedings

  /usecase-proceedings/{usecase_proceedings_id}/{usecase_proceedings_version}/usecase-proceedings:
    get:
      description: |
        Recupero elenco delle fattispecie relazionate a una data fattispecie

      parameters:
        - in: path
          name: usecase_proceedings_id
          description: id della fattispecie
          required: true
          schema:
            type: string
        - name: usecase_proceedings_version
          in: path
          description: versione della fattispecie
          required: true
          schema:
            type: string
            pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"

      responses:
        "200":
          description: Elenco delle fattispecie relazionate alla fattispecie richiesta
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - usecase-proceeding
                    - mandatory
                  properties:
                    usecase-proceeding:
                      $ref: "#/components/schemas/UseCaseProceeding"
                    mandatory:
                      type: boolean

          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavaliable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []

      tags:
        - UseCases

  /form/{form_id}/{form_version}/xsd:
    get:
      description: |
        Recupero XML Schema di uno specifico modulo digitale

      parameters:
        - in: path
          name: form_id
          description: id del modulo digitale
          required: true
          schema:
            type: string
        - name: form_version
          in: path
          description: versione del modulo digitale
          required: true
          schema:
            type: string
            pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"

      responses:
        "200":
          description: XMLSchema del modulo digitale richiesto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceEntity"
             

          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavaliable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []

      tags:
        - Forms

  /form/{form_id}/{form_version}/schematron:
    get:
      description: |
        Recupero Schematron riferito ad un specifico modulo digitale

      parameters:
        - in: path
          name: form_id
          description: id del modulo digitale
          required: true
          schema:
            type: string
        - name: form_version
          in: path
          description: versione del modulo digitale
          required: true
          schema:
            type: string
            pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"

      responses:
        "200":
          description: Schematron associato al modulo digitale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceEntity"

          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavaliable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []

      tags:
        - Forms

  /attachment/{attachment_id}/{attachment_version}/xsd:
    get:
      description: |
        Recupero XML Schema riferito a un specifico allegato

      parameters:
        - in: path
          name: attachment_id
          description: id dell'allegato
          required: true
          schema:
            type: string
        - name: attachment_version
          in: path
          description: versione dell'allegato
          required: true
          schema:
            type: string
            pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"

      responses:
        "200":
          description: XML Schema associato all'allegato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceEntity"

          headers:
            Agid-JWT-Signature:
              $ref: "#/components/headers/Agid-JWT-Signature"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
