      description: |
        Recupero Sistema FrontOffice di uno specifico Sportello
      parameters:
        - in: path
          name: single_desk_id
          description: id dello Sportello
          required: true
          schema:
            type: string
        - name: single_desk_version
          in: path
          description: versione dello Sportello
          required: true
          schema:
