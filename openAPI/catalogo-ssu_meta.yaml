        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavaliable"

      security:
        - bearerAuth: []
          Agid-JWT-Signature: []

      tags:
        - Sportello

  /single_desk/{single_desk_id}/{single_desk_version}/backoffice-system:
    get:
      description: |
        Recupero Sistema BackOffice di uno specifico Sportello
      parameters:
        - in: path
          name: single_desk_id
          description: id dello Sportello
          required: true
          schema:
            type: string
        - name: single_desk_version
          in: path
          description: versione dello Sportello
          required: true
          schema:
            type: string
            pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"

      responses:
        "200":
          description: Sistema BackOffice dello Sportello richiesto
          content:
            application/json:
