          $ref: "#/components/headers/Agid-JWT-Signature"

    Unauthorized:
      description: Richiesta non autorizzata
      headers:
        Agid-JWT-Signature:
          $ref: "#/components/headers/Agid-JWT-Signature"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: risorsa non trovata
      headers:
        Agid-JWT-Signature:
          $ref: "#/components/headers/Agid-JWT-Signature"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Errore processamento richiesta
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        Agid-JWT-Signature:
          $ref: "#/components/headers/Agid-JWT-Signature"

  schemas:
    AdministrationSchema:
      description: Amministrazione compentente censita nel Catalogo SSU
      type: object
      required:
        - ipacode
        - officecode
        - version
        - description
      properties:
        ipacode:
          title: codice IPA dell'amministrazione
          type: string
          minLength: 1
        officecode:
          title: codice dell'ufficio dell'amministrazione 
          type: string
          minLength: 1
        version:
          title: versione dell'ufficio dell'amministrazione 
          type: string
          pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"
        description:
            title: descrizione dell'amministrazione
            type: string 

    Times:
      description: tempi amministrativi dell'istanza
      type: object
      required:
      - max_gg_proc
      properties:
        max_gg_proc:          
          title: numero di giorni limite a partire da start entro cui l'istanza deve concludersi
          type: integer
          format: int32
        max_gg_correction:
          title: numero di giorni limite a partire da start per la correzione a valle di un controllo formale
          type: integer
          format: int32
        max_gg_admissibility:          
          title: numero di giorni limite a partire da start per la verifica di ammissibilità
          type: integer
          format: int32
        max_gg_int_req:          
          title: numero di giorni limite a partire da start per la richiesta di integrazione degli enti terzi
          type: integer
          format: int32
        max_gg_int_resp:          
          title: numero di giorni limite a partire da start per integrazione del soggetto presentatore
          type: integer
          format: int32
        max_gg_conf_req:          
          title: numero di giorni limite a partire da start per la richiesta di conformazione degli enti terzi
          type: integer
          format: int32
        max_gg_conf_resp:          
          title: numero di giorni limite a partire da start per conformazione del soggetto presentatore
          type: integer
          format: int32
        max_gg_concl_send:          
          title: numero di giorni limite a partire da start per inoltro delle conclusioni degli enti terzi
          type: integer
          format: int32
        max_gg_cdss_req:          
          title: numero di giorni limite a partire da start entro cui gli enti terzi possono richiedere conferenza di servizi sincrona
          type: integer
          format: int32
        max_gg_inspection:          
          title: numero di giorni limite a partire da start entro cui gli enti terzi possono effettuare un'ispezione e inviare il relativo esito
          type: integer
          format: int32
        max_gg_prov_cond_ext_req:          
          title: numero di giorni limite a partire da start entro cui gli enti terzi possono effettuare una richiesta di proroga per il provvedimento condizionato 
          type: integer
          format: int32

    Error:
      type: object
      description: codice e descrizione condizione di errore
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message

    GenericEntity:
      description: struttura di risorsa generica con id,versione e descrizione
      type: object
      required:
        - id
        - version
        - description
      properties:
        id:
          title: identificativo univoco della risorsa
          type: string
        version:
          title: version della risorsa
          type: string
        description:
          title: descrizione della risorsa
          type: string
      example:
        id: 1
        version: 1.0.0
        description: Entità generica con id,versione, descrizione
    
    ContextEntity:
      allOf:
        - $ref: "#/components/schemas/GenericEntity"
        - type: object
          required:
            - context
          properties:
            context:
              title: contesto di riferimento
              type: string
      example:
        id: 1
        version: 1.0.0
        description: Entità generica con id,versione, descrizione
        context: SUAP

    ComponentEntity:
      allOf:
        - $ref: "#/components/schemas/GenericEntity"
        - type: object
          required:
            - start
            - end
            - state
          properties:
            start:          
              title: data inizio intervallo di validità della versione
              type: string
              format: date
            end:          
              title: data fine intervallo di validità della versione
              type: string
              format: date
            state:
              title: stato di validità della versione
              type: string
              enum:
                - Active
                - Not Active
                - Revocated
      example:
        id: 1
        version: 1.0.0
        description: Entità generica con id,versione, descrizione
        start: 2024-01-01
        end: 2024-12-31
        state: Active
    
    DeskEntity:
      description: struttura di risorsa generica con id,versione e descrizione
      allOf:
        - $ref: "#/components/schemas/ComponentEntity"
        - type: object
          required:
            - context
          properties:
            context:
              title: contesto di riferimento (es. SUAP, SUE, ZES)
              type: string

      example:
        id: 1
        version: 1.0.0
        description: Entità generica con id,versione, descrizione
        start: 2024-01-01
        end: 2024-12-31
        state: Active
        context: SUAP

    DocumentEntity:
      allOf:
        - $ref: "#/components/schemas/GenericEntity"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - structured
                - unstructured
      example:
        id: 1
        version: 1.0.0
        description: Entità id,versione, descrizione e tipo strutturato/non strutturato
        type: structured 
    
    ResourceEntity:
      allOf:
        - $ref: "#/components/schemas/GenericEntity"
        - type: object
          required:
            - resource
          properties:
            resource:
              type: string
              format: byte
      example:
        id: 1
        version: 1.0.0
        description: Entita id,versione, descrizione e risorsa binaria codificata in base64
        resource: "U3dhZ2dlciByb2Nrcw=="

    SystemEntity:
      allOf:
        - $ref: "#/components/schemas/GenericEntity"
        - type: object
          required:
            - telematic_ref
          properties:
            telematic_ref:
              type: string
      example:
        id: 1
        version: 1.0.0
        description: Entita id,versione, descrizione e riferimento telemantico sistema implementante
        telematic_ref: string
    
    FOSystemEntity:
      allOf:
        - $ref: "#/components/schemas/ComponentEntity"
        - type: object
          required:
            - e_service_to_bo
          properties:
            e_service_to_bo:
              type: string
            e_service_to_cu:
              type: string
      example:
        id: 1
        version: 1.0.0
        description: Entità generica con id,versione, descrizione
        start: 2024-01-01
        end: 2024-12-31
        state: Active
        e_service_to_bo: string
        e_service_to_cu: string
      
    BOSystemEntity:
      allOf:
        - $ref: "#/components/schemas/ComponentEntity"
        - type: object
          required:
            - e_service_to_fo
            - e_service_to_et
            - e_service_to_ri
          properties:
            e_service_to_fo:
              type: string
            e_service_to_et:
              type: string  
            e_service_to_ri:
              type: string  
      example:
        id: 1
        version: 1.0.0
        description: Entità generica con id,versione, descrizione
        start: 2024-01-01
        end: 2024-12-31
        state: Active
        e_service_to_fo: string
        e_service_to_et: string  
        e_service_to_ri: string

    Proceeding:
      description: procedimento amministrativo
      allOf:
        - $ref: "#/components/schemas/GenericEntity"
        - type: object
          required:
            - typology
            - lifeevent
            - territorial_scope
            - status
            - context
          properties:
            typology:
              title: tipologia del procedimento
              type: string
            lifeevent:
              title: evento della vita dell'attività afferente al procedimento
              type: string
            territorial_scope:
              title: ambito territoriale del procedimento (codice istat a 6 cifre e 000000 per Nazionale)
              type: string
            status:
              title: stato del procedimento (attivo, non attivo)
              type: string
              enum: 
                - Active
                - Not Active
            context:
              title: contesto di riferimento (SUAP, SUE, ZES)
              type: string

      example:
        id: 1
        version: 1.0.0
        description: Entita  procedimento
        typology: esercizio_vicinato
        lifeevent: apertura
        territorial_scope: 00000000
        status: Active
        context: ZES

    UseCaseProceeding:
      allOf:
        - $ref: "#/components/schemas/GenericEntity"
        - type: object
          required:
            - proceeding_id
            - proceeding_version
            - proceeding_context
          properties:
            proceeding_id:
              type: string
            proceeding_version:
              type: string
            proceeding_context:
              title: contesto di riferimento (SUAP, SUE, ZES)
              type: string
            schematron_phase:
              type: string

      example:
        id: 1
        version: 1.0.0
        description: Entita  fattispecie procedimento
        proceeding_id: string
        proceeding_version: 1.0.0
        proceeding_context: SUAP
        schematron_phase: phase_1
    
    AdministrativeRegime:
      description: Regimi amministrativi dei procedimenti
      type: object
      required:
        - context
        - id
        - version
        - description
      properties:
        context:
          title: contesto cui il regime amministrativo è associato
          type: string
        id:
          title: identificativo unico del regime amministrativo recuperato da apposito servizio
          type: string
        version:
          title: version del regime amministrativo
          type: string
        description:
          title: descrizione del regime amministrativo
          type: string
      example:
        context: SUAP
        id: SCIA
        version: 1.0.0
        description: Entità regime amministrativo con id,versione, descrizione

    third_party_system:
      allOf:
        - $ref: "#/components/schemas/SystemEntity"
        - type: object
          properties:
            date_from:
              type: string
              format: date 
            date_to:
              type: string
              format: date
              
      example:
        id: 1
        version: 1.0.0
        description: Entita id,versione, descrizione e riferimento telemantico sistema implementante
        telematic_ref: string
        date_from: 2023-11-14
        date_to: 2023-12-14

  headers:
    Agid-JWT-Signature:
      schema:
        format: JWS
        maxLength: 4096
        type: string
        example: eyJzd.fafa.fafafa
      description: |-
        Il valore di questo header è una token JWT firmato secondo la specifica JWS.
        Vedi Modi [integrity_rest_02] Integrità del payload del messaggio REST.
        In ogni caso la versione del pattern di sicurezza da utilizzare è l'ultima versione indicata da PDND.

  securitySchemes:
    bearerAuth:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Implementazione conforme ad RFC8725

    Agid-JWT-Signature:
      type: apiKey
      description: |-
        Il valore di questo header è una token JWT firmato secondo la specifica JWS.
        Vedi Modi [integrity_rest_02] Integrità del payload del messaggio REST.
        In ogni caso la versione del pattern di sicurezza da utilizzare è l'ultima versione indicata da PDND.
      name: Agid-JWT-Signature
      in: header
