openapi: 3.0.3

info:
    title: Ente Terzo to BackOffice

    version: 1.0.0

    description: |-
        API rese disponibili da  Ente Terzo a BackOffice

    contact:
        name: AgID - Agenzia per l'Italia Digitale
        url: https://www.agid.gov.it/

    license:
        name: CC BY-NC-SA 4.0
        url: https://creativecommons.org/licenses/by-nc-sa/4.0/

servers:
    - url: https://<system host+subdomains>.it
      description: BackOffice to Ente Terzo endpoint

paths:
    /retry:
        post:
            description: Richiesta di ritrasmissione dati relativi ad una specifica operation a causa di incoerenze riscontrate sui dati ricevuti.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                cui:
                                    $ref: "#/components/schemas/cui"
                                operation:
                                    description: operation per la quale si richiede la ritrasmissione
                                    type: string
                                    enum:
                                        - send_conclusions
                                        - request_cdss
                                        - request_integration
                                        - request_conformation
                                usecase_proceeding:        
                                    title: codice della fattispecie presente nel Catalogo
                                    type: string
                                    minLength: 1
                                error:
                                    $ref: "#/components/schemas/Error"

            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /send_instance:
        description: Inoltro dei riferimenti a un' istanza di procedimento.
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SendInstanceRequest"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /send_instance_updated_documents:
      description: Inoltro dei riferimenti con i documenti integrati
      post:
          requestBody:
              content:
                  application/json:
                      schema:
                          $ref: "#/components/schemas/SendUpdatedDocuments"
              required: true
          responses:
              "200":
                  $ref: "#/components/responses/OKRequest"
              "400":
                  $ref: "#/components/responses/BadRequest"
              "401":
                  $ref: "#/components/responses/Unauthorized"
              "500":
                  $ref: "#/components/responses/ServerError"
              "503":
                  $ref: "#/components/responses/ServiceUnavailable"
          security:
              - bearerAuth: []
                Agid-JWT-Signature: []

    /instance/{cui_uuid}/document/{resource_id}:
        get:
            description: |
                Recupero di una specifica risorsa (xml, documento digitale) in relazione a una data istanza di procedimento.

            parameters:
                - in: header
                  name: Range
                  description: Specifica l'intervallo di byte richiesto per il recupero parziale della risorsa.
                  required: false
                  schema:
                    type: string
                    example: bytes=0-999
                - in: header
                  name: If-Match
                  description: precondizione contenente l'hash della risorsa
                  required: true
                  schema:
                      type: string
                - name: cui_uuid
                  in: path
                  description: UUID del CUI
                  required: true
                  schema:
                      type: string
                - name: resource_id
                  in: path
                  description: id risorsa documento
                  required: true
                  schema:
                      type: string

            responses:
                "200":
                    description: risorsa richiesta, codificata in base64, il mime type relativo è specificato nel descrittore dell'istanza
                    content:
                        text/plain:
                            schema:
                                type: string
                                format: byte
                    headers:
                        Agid-JWT-Signature:
                            $ref: "#/components/headers/Agid-JWT-Signature"

                "206":
                    description: porzione di risorsa richiesta, codificata in base64, il mime type relativo è specificato nel descrittore dell'istanza
                    content:
                        text/plain:
                            schema:
                                type: string
                                format: byte
                    headers:
                        Content-Range:
                            description: espressione del range incluso nella risposta
                            schema:
                                type: string
                                example: bytes 21010-47021/47022
                        Agid-JWT-Signature:
                            $ref: "#/components/headers/Agid-JWT-Signature"

                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "412":
                    $ref: "#/components/responses/PreconditionFailed"
                "416":
                    $ref: "#/components/responses/RangeNotSatisfiable"
                "428":
                    $ref: "#/components/responses/PreconditionRequired"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /notify:
        post:
            description: Notifica eventi di processo di una data istanza di procedimento.
            requestBody:
                content:
                    application/json:
                        schema:
                            oneOf:
                                - $ref: "#/components/schemas/NotifyMessage"
                                - $ref: "#/components/schemas/CdsNotifyMessage"
                                - $ref: "#/components/schemas/CdssNotifyMessage"
                                - $ref: "#/components/schemas/TransferNotifyMessage"
                                - $ref: "#/components/schemas/ReopenProceedingNotification"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /cdss_resolution_forward:
        post:
            description: Trasferimento della determinazione conclusiva della Conferenza dei servizi sincrona.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            required:	
                                - cui
                                - instance_descriptor_version
                                - cdss_resolution
                            properties:
                              cui:
                                  $ref: "#/components/schemas/cui"
                              instance_descriptor_version:
                                  type: string
                              cdss_resolution:  	
                                  $ref: "#/components/schemas/CdssResolution"
                              outcome:  
                                  type: string
                                  enum: 
                                    - positive_outcome
                                    - negative_outcome
                              resolution_update:
                                  description: definisce se si tratta del primo trasferimento della determinazione conclusiva o del suo aggiornamento (Art. 14-quinquies)
                                  type: boolean
                              date:
                                  title: data di trasferimento della determinazione conclusiva
                                  type: string
                                  format: date
                              additional_document_list:  
                                  type: array
                                  items:
                                      type: object
                                      required:
                                          - description
                                          - document
                                      properties:
                                          description:                            
                                              title: descrizione della risorsa
                                              type: string
                                              minLength: 1
                                          document:
                                              $ref: "#/components/schemas/Document"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

components:
    responses:
        OKRequest:
            description: Richiesta completata con successo
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        BadRequest:
            description: Forma della richiesta non conforme alla specifica
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        NotFound:
            description: risorsa non trovata
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
        
        Conflict:
            description: conflitto sulla risorsa, la richiesta non può essere elaborata a causa di un conflitto nello stato coerente della risorsa
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
                
        PreconditionFailed:
            description: precondizione fallita, rappresentazione risorsa non correttamente individuata
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
        
        RangeNotSatisfiable:
            description: richiesta di range non soddisfacibile
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
                Content-Range:
                    description: lunghezza attuale della rappresentazione selezionata
                    schema:
                        type: string
                        example: bytes */47022

        PreconditionRequired:
            description: precondizione richiesta, rappresentazione risorsa non correttamente individuata
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        ServiceUnavailable:
            description: Servizio non disponibile
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        Unauthorized:
            description: Richiesta non autorizzata
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        ServerError:
            description: Errore processamento richiesta
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

    schemas:
        cui:
            type: object
            description: codice unico dell'istanza
            required:
                - context
                - sub_context
                - data
                - progressivo
                - uuid
            properties:
                context:
                    title: contesto dell'istanza
                    type: string
                
                sub_context:
                    title: Specificità del contesto (es. SUE Produttivo, SUE Residenziale)
                    type: string
                    
                data:
                    title: data emissione cui
                    type: string
                    format: date
                
                progressivo:
                    title: numero progressivo a rotazione annuale
                    type: string

                uuid:
                    title: UUID chiave del CUI
                    type: string
                    
        InstanceIndex:
            type: array
            description: indice istanza
            items:
                type: object
                required: 
                - usec_code
                - usec_version
                - ref
                - description
                - resource_id
                - hash
                - alg_hash
                properties:
                    usec_code:                            
                        title: codice della fattispecie presente nel Catalogo
                        type: string
                        minLength: 1
                    usec_version:
                        title: versione della fattispecie presente nel Catalogo
                        type: string
                        minLength: 1
                    ref:                            
                        title: riferimento all'elemento dell'istanza relativo al procedimento
                        type: string
                        minLength: 1
                    description:                            
                        title: dscrizione della risorsa
                        type: string
                        minLength: 1
                    resource_id:                            
                        title: id della risorsa, univoco per erogatore e CUI.UUID
                        type: string
                        minLength: 1
                    filename:                      
                        title: filename della risorsa 
                        type: string
                        minLength: 1
                    file_size:
                        description: Dimensione del file.
                        type: integer
                    mime_type:
                        title: "indica il formato dei dati previsto per la risorsa"
                        type: string
                    hash:                            
                        title: hash dell'elemento dell'istanza relativo al procedimento
                        type: string
                        minLength: 1
                    alg_hash:                                
                        title: algoritmo hash applicato
                        type: string
                        enum:
                        - S256
                        - S384
                        - S512
        GeneralIndex:
                      type: array
                      description: indice allegati trasversali
                      minItems: 0
                      uniqueItems: true
                      items:
                        anyOf:
                          - $ref: '#/components/schemas/ricevuta_xml'
                          - $ref: '#/components/schemas/ricevuta_pdf'
                          - $ref: '#/components/schemas/suap_xml'
                          - $ref: '#/components/schemas/suap_pdf'
                          - $ref: '#/components/schemas/suap_rea_start_xml'
                          - $ref: '#/components/schemas/suap_rea_update_xml'
                          - $ref: '#/components/schemas/comunica_cui_xml'
                          - $ref: '#/components/schemas/comunica_cui_pdf'
        ricevuta_xml:
                      type: object
                      description: il presente documento è validato con l’XML Schema definito ai sensi dell’allegato al DPR 160/2010
                        precedente alla variazione DECRETO 12 novembre 2021 recuperabile nella sezione regole “Regole tecniche”
                        del portale impresainungiorno
                        (https://www.impresainungiorno.gov.it/documents/155997/157492/SUAP-ricevuta-1.1.4.xsd/58b9d8e8-2b76-4b8b-adee-0cf9c2bbe04a)
                      additionalProperties: false
                      required:
                        - name
                        - mime_type
                        - resource_id
                        - hash
                        - alg_hash
                      properties:
                        name:
                          type: string
                          enum:
                            - RICEVUTA_XML
                        mime_type:
                          type: string
                          enum:
                            - application/xml
                            - application/pkcs7-mime
                        resource_id:
                          type: string
                          minLength: 1
                        file_size:
                          description: Dimensione del file.
                          type: integer
                        hash:
                          type: string
                          minLength: 1
                        alg_hash:
                          type: string
                          enum:
                            - S256
                            - S384
                            - S512
        ricevuta_pdf:
                      type: object
                      additionalProperties: false
                      required:
                        - name
                        - mime_type
                        - resource_id
                        - hash
                        - alg_hash
                      properties:
                        name:
                          type: string
                          enum:
                            - RICEVUTA_PDF
                        mime_type:
                          type: string
                          enum:
                            - application/pdf
                            - application/pkcs7-mime
                        resource_id:
                          type: string
                          minLength: 1
                        file_size:
                          description: Dimensione del file.
                          type: integer
                        hash:
                          type: string
                          minLength: 1
                        alg_hash:
                          type: string
                          enum:
                            - S256
                            - S384
                            - S512
        suap_xml:
                      type: object
                      description: il presente documento è validato con l’XML Schema definito ai sensi dell’allegato al DPR 160/2010
                        precedente alla variazione DECRETO 12 novembre 2021 recuperabile nella sezione regole “Regole tecniche”
                        del portale impresainungiorno
                        (https://www.impresainungiorno.gov.it/documents/155997/157492/pratica_suap-2.0.0.xsd/74b7ffb2-fe01-41c6-b210-be36139923e4 , 
                        https://www.impresainungiorno.gov.it/documents/155997/157492/Definizione+delle+strutture+dati+elementari+di+impresainungiorno.xsd/43929369-48f0-4b7b-883e-f57dc5cdd41e)
                      additionalProperties: false
                      required:
                        - name
                        - mime_type
                        - resource_id
                        - hash
                        - alg_hash
                      properties:
                        name:
                          type: string
                          enum:
                            - SUAP_XML
                        mime_type:
                          type: string
                          enum:
                            - application/xml
                            - application/pkcs7-mime
                        resource_id:
                          type: string
                          minLength: 1
                        file_size:
                          description: Dimensione del file.
                          type: integer
                        hash:
                          type: string
                          minLength: 1
                        alg_hash:
                          type: string
                          enum:
                            - S256
                            - S384
                            - S512
        suap_pdf:
                      type: object
                      additionalProperties: false
                      required:
                        - name
                        - mime_type
                        - resource_id
                        - hash
                        - alg_hash
                      properties:
                        name:
                          type: string
                          enum:
                            - SUAP_PDF
                        mime_type:
                          type: string
                          enum:
                            - application/pdf
                            - application/pkcs7-mime
                        resource_id:
                          type: string
                          minLength: 1
                        file_size:
                          description: Dimensione del file.
                          type: integer
                        hash:
                          type: string
                          minLength: 1
                        alg_hash:
                          type: string
                          enum:
                            - S256
                            - S384
                            - S512
        suap_rea_start_xml:
                      type: object
                      description: il presente documento è validato con l’XML Schema definito ai sensi dell’allegato al DPR 160/2010
                        precedente alla variazione DECRETO 12 novembre 2021 recuperabile nella sezione regole “Regole tecniche”
                        del portale impresainungiorno
                        (https://www.impresainungiorno.gov.it/documents/155997/157488/suap-rea-1.1.1.xsd/2094658b-c981-4795-8d18-ffa91fa97069)
                      additionalProperties: false
                      required:
                        - name
                        - mime_type
                        - resource_id
                        - hash
                        - alg_hash
                      properties:
                        name:
                          type: string
                          enum:
                            - SUAP_REA_START_XML
                        mime_type:
                          type: string
                          enum:
                            - application/xml
                            - application/pkcs7-mime
                        resource_id:
                          type: string
                          minLength: 1
                        file_size:
                          description: Dimensione del file.
                          type: integer
                        hash:
                          type: string
                          minLength: 1
                        alg_hash:
                          type: string
                          enum:
                            - S256
                            - S384
                            - S512
        suap_rea_update_xml:
                      type: object
                      description: il presente documento è validato con l’XML Schema definito ai sensi dell’allegato al DPR 160/2010
                        precedente alla variazione DECRETO 12 novembre 2021 recuperabile nella sezione regole “Regole tecniche”
                        del portale impresainungiorno
                        (https://www.impresainungiorno.gov.it/documents/155997/157488/suap-rea-1.1.1.xsd/2094658b-c981-4795-8d18-ffa91fa97069)
                      additionalProperties: false
                      required:
                        - name
                        - mime_type
                        - resource_id
                        - hash
                        - alg_hash
                      properties:
                        name:
                          type: string
                          enum:
                            - SUAP_REA_UPDATE_XML
                        mime_type:
                          type: string
                          enum:
                            - application/xml
                            - application/pkcs7-mime
                        resource_id:
                          type: string
                          minLength: 1
                        file_size:
                          description: Dimensione del file.
                          type: integer
                        hash:
                          type: string
                          minLength: 1
                        alg_hash:
                          type: string
                          enum:
                            - S256
                            - S384
                            - S512

        comunica_cui_xml:
                      type: object
                      description: il presente documento è validato con l’XML Schema definito ai sensi dell’allegato al DPR 160/2010
                        precedente alla variazione DECRETO 12 novembre 2021 recuperabile nella sezione regole “Regole tecniche”
                        del portale impresainungiorno
                        (https://www.registroimprese.it/documents/20195/0/specifichecomunicazioneunica.zip)
                      additionalProperties: false
                      required:
                        - name
                        - mime_type
                        - resource_id
                        - hash
                        - alg_hash
                      properties:
                        name:
                          type: string
                          enum:
                            - COMUNICA_CUI_XML
                        mime_type:
                          type: string
                          enum:
                            - application/xml
                            - application/pkcs7-mime
                        resource_id:
                          type: string
                          minLength: 1
                        file_size:
                          description: Dimensione del file.
                          type: integer
                        hash:
                          type: string
                          minLength: 1
                        alg_hash:
                          type: string
                          enum:
                            - S256
                            - S384
                            - S512
        comunica_cui_pdf:
                      type: object
                      additionalProperties: false
                      required:
                        - name
                        - mime_type
                        - resource_id
                        - hash
                        - alg_hash
                      properties:
                        name:
                          type: string
                          enum:
                            - COMUNICA_CUI_PDF
                        mime_type:
                          type: string
                          enum:
                            - application/pdf
                            - application/pkcs7-mime
                        resource_id:
                          type: string
                          minLength: 1
                        file_size:
                          description: Dimensione del file.
                          type: integer
                        hash:
                          type: string
                          minLength: 1
                        alg_hash:
                          type: string
                          enum:
                            - S256
                            - S384
                            - S512

        Error:
            type: object
            description: codice e descrizione condizione di errore
            properties:
                code:
                    type: string
                message:
                    type: string
            required:
                - code
                - message
        
        SendInstanceRequest:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - instance_index
                - general_index
                - receiver_administration
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                instance_index:
                    $ref: "#/components/schemas/InstanceIndex"
                general_index:
                    $ref: "#/components/schemas/GeneralIndex"
                receiver_administration:
                    title: amministrazione destinataria delle istanze
                    $ref: "#/components/schemas/AdministrationSchema"
                purpose:
                    title: motivo dell'invio dell'istanza (ad es. a fronte di una convocazione della Cdss o per via di una istruttoria ET)
                    type: string
                    enum:
                        - Cdss
                        - Istruttoria 

        SendUpdatedDocuments:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - updated_documents
                - receiver_administration
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                updated_documents:
                    $ref: "#/components/schemas/InstanceIndex"
                receiver_administration:
                    title: amministrazione destinataria delle istanze
                    $ref: "#/components/schemas/AdministrationSchema"
        
        CdssResolution:
            type: object
            required:
                - document
            properties:
                document:
                        $ref: "#/components/schemas/Document"
                unanimous_decision:
                    title: dichiara se la determinazione è stata approvata all'unanimità o sulla base delle posizioni prevalenti.
                    type: boolean
        
        AdministrationSchema:
            description: Amministrazione compentente censita nel Catalogo SSU
            type: object
            required:
                - ipacode
                - officecode
                - version
                - description
            properties:
                ipacode:
                    title: codice IPA dell'amministrazione
                    type: string
                    minLength: 1
                officecode:
                    title: codice dell'ufficio dell'amministrazione 
                    type: string
                    minLength: 1
                version:
                    title: versione dell'ufficio dell'amministrazione 
                    type: string
                    pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"
                description:
                    title: descrizione dell'amministrazione
                    type: string
        
        NotifyMessage:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - event

            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                event:
                    type: string
                    pattern: >-
                        ^end_by_proceeding_time_expired|end_by_integration_times_expired|end_by_conformation_times_expired|end_by_submitter_cancel_requested|integration_request_time_expired|end_by_definitive_provision_granted|end_by_conditional_provision_rescinded|end_by_conditional_provision_denied|conditional_provision_extended|conformation_request_times_expired|end_by_observations_times_expired|integration_requested|conformation_requested|involved_et_[0-9]{1,10}|second_provision_response_time_expired|second_provision_time_expired$



        CdsaNotifyMessage:
          allOf:
            - $ref: "#/components/schemas/NotifyMessage"
            - type: object
            - required: 
                - event
                - document
              properties:
                event:
                  type: string
                  enum:
                    - cdsa_convened
                document:
                  $ref: "#/components/schemas/Document"
        
        TransferNotifyMessage:
            type: object
            oneOf:
                - $ref: "#/components/schemas/OutcomeMessage"
                - $ref: "#/components/schemas/PreliminaryResolutionMessage"
                - $ref: "#/components/schemas/ObservationsToImpedimentsMessage"
                - $ref: "#/components/schemas/GenericCommunicationMessage"
                - $ref: "#/components/schemas/MinutesCdssTrasmissionMessage"
                        
        TransferMessage:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - event
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                event:
                    type: string
                    enum:
                        - end_by_suspension_requested
                        - end_by_positive_outcome
                        - end_by_negative_outcome
                        - response_to_impediments_provided
                        - integration_response_time_expired
                        - conformation_response_time_expired
                document:
                    $ref: "#/components/schemas/Document"
        
        ReopenProceedingNotification: 
            type: object
            required:
                - cui
                - instance_descriptor_version
                - reopen_proceeding_document
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                reopen_proceeding_document:
                    type: object
                    required:
                        - document
                    properties:
                        document:
                            $ref: "#/components/schemas/Document"
                integration_list:
                    type: array
                    items:
                        type: object
                        required:
                            - code
                            - integration_request
                        properties:
                            code:
                                title: codice della fattispecie presente nel Catalogo
                                type: string
                                minLength: 1
                            ref:
                                title: riferimento all'elemento dell'istanza relativo al procedimento (procedimento o allegato)
                                type: string
                                minLength: 1
                            integration_request:
                                title: elenco integrazioni richieste da uno o più enti terzi
                                type: array
                                items:
                                    type: object
                                    properties:
                                        request:
                                            title: testo integrazione richiesta
                                            type: string
                integration_document_list:  
                    type: array
                    description: le presenti integrazioni possono essere richieste per rispondere a quanto definito dall'articolo 21-decies della Legge 241/90
                    items:
                        type: object
                        required:
                            - document
                        properties:
                            document:
                                $ref: "#/components/schemas/Document"
        
        OutcomeMessage:
            type: object
            allOf:
                - $ref: "#/components/schemas/TransferMessage"
            properties:
                event:
                    type: string
                    enum:
                        - end_by_suspension_requested
                        - end_by_positive_outcome
                        - end_by_negative_outcome

        MinutesCdssTrasmissionMessage:
          type: object
          required:
            - event
          allOf:
            - $ref: "#/components/schemas/TransferMessage"
          properties:
            event:
              type: string
              enum:
                - minutes_cdss_trasmission
        
        PreliminaryResolutionMessage:
            type: object
            allOf:
                - $ref: "#/components/schemas/TransferMessage"
            properties:
                event:
                    type: string
                    enum:
                        - positive_cds_preliminary_resolution
                        - negative_cds_preliminary_resolution
        
        ObservationsToImpedimentsMessage:
            type: object
            allOf:
                - $ref: "#/components/schemas/TransferMessage"
            properties:
                event:
                    type: string
                    enum:
                        - observations_to_impediments_provided

        GenericCommunicationMessage:
            type: object
            required:
              - event
              - requester_administration
            allOf:
              - $ref: "#/components/schemas/TransferMessage"
            properties:
              event:
                type: string
                enum:
                  - generic_communication
              requester_administration:
                title: amministrazione richiedente
                $ref: "#/components/schemas/AdministrationSchema"
    
        CdsNotifyMessage:
            allOf:
              - $ref: "#/components/schemas/CdsaNotifyMessage"
              - type: object
                required:
                    - event
                properties:
                    event:
                        type: string
                        enum:
                            - cds_istruttoria_convened
                            - cds_decisoria_convened
                            - cds_preliminare_convened
                    document:
                        description: Atto amministrativo di indizione della conferenza
                        $ref: "#/components/schemas/Document"

        CdssNotifyMessage:
            allOf:
              - $ref: "#/components/schemas/CdsNotifyMessage"
              - type: object
                required:
                    - cdss_channel
                    - cdss_convocation
                properties:
                    event:
                        type: string
                        enum:
                            - cdss_convened
                    cdss_channel:
                        type: string
                        title: "canale utilizzato per la convocazione della Conferenza dei Servizi Sincrona"
                        minLength: 1
                    cdss_convocation:
                        title: "data della convocazione della Conferenza dei Servizi Sincrona"
                        type: string
                        format: date
                        minLength: 1

        Document:
            type: object
            required:
                - resource_id
                - mime_type
                - hash
                - alg_hash
            properties:
                resource_id:
                    title: id della risorsa del documento
                    type: string
                    minLength: 1
                filename:                      
                    title: filename della risorsa del documento
                    type: string
                    minLength: 1
                mime_type:
                    title: indica il formato dei dati previsto per il documento
                    type: string
                    enum: 
                        - application/pdf
                        - application/pkcs7-mime
                file_size:
                    description: dimensione del file
                    type: integer
                hash:
                    title: hash risorsa
                    type: string
                    minLength: 1
                alg_hash:
                    title: algoritmo hash applicato
                    type: string
                    enum:
                    - S256
                    - S384
                    - S512            

    headers:
        Agid-JWT-Signature:
            schema:
                format: JWS
                maxLength: 4096
                type: string
                example: eyJzd.fafa.fafafa
            description: |-
                Il valore di questo header è una token JWT firmato secondo la specifica JWS.
                Vedi Modi  [integrity_rest_02] Integrità del payload del messaggio REST.
                In ogni caso la versione del pattern di sicurezza da utilizzare è l'ultima versione indicata da PDND.

    securitySchemes:
        bearerAuth:
            scheme: bearer
            bearerFormat: JWT
            type: http
            description: Implementazione conforme ad RFC8725

        Agid-JWT-Signature:
            type: apiKey
            description: |-
                Il valore di questo header è una token JWT firmato secondo la specifica JWS.
                Vedi Modi  [integrity_rest_02] Integrità del payload del messaggio REST.
                In ogni caso la versione del pattern di sicurezza da utilizzare è l'ultima versione indicata da PDND.
            name: Agid-JWT-Signature
            in: header
