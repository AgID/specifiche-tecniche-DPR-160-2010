openapi: 3.0.3

info:
    title: FrontOffice to BackOffice

    version: 1.0.0

    description: |-
        API rese disponibili da FrontOffice a BackOffice

    contact:
        name: AgID - Agenzia per l'Italia Digitale
        url: https://www.agid.gov.it/

    license:
        name: CC BY-NC-SA 4.0
        url: https://creativecommons.org/licenses/by-nc-sa/4.0/

servers:
    - url: https://<system host+subdomains>.it
      description: FrontOffice to BackOffice endpoint


paths:
    /retry:
        post:
            description: Richiesta di ritrasmissione dati relativi ad una specifica operation a causa di incoerenze riscontrate sui dati ricevuti.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                cui:
                                    $ref: "#/components/schemas/cui"
                                operation:
                                    description: operation per la quale si richiede la ritrasmissione
                                    type: string
                                    enum:
                                        - send_instance
                                        - notify_receipt
                                        - cancel_instance
                                error:
                                    $ref: "#/components/schemas/Error"

            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /request_correction:
        post:
            description: Inoltro di una richiesta di correzione a una data istanza di procedimento.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RequestCorrectionRequest"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /request_integration:
        post:
            description: Inoltro di una richiesta di integrazioni a una data istanza di procedimento.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/IntegrationRequest"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /request_conformation:
        post:
            description: Richiesta di conformazione in relazione a una data instanza di procedimento
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ConformationRequest"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /instance/{cui_uuid}/document/{resource_id}:
        get:
            description: | 
                Recupero risorsa documento per un dato CUI.
                Le Range Request (RFC9110) sono supportate soltanto in modalità single part.
            
            parameters:
                - in: header
                  name: Range
                  description: Specifica l'intervallo di byte richiesto per il recupero parziale della risorsa (RFC 9110, single part).
                  required: false
                  schema:
                    type: string
                    example: bytes=0-999
                - in: header
                  name: If-Match
                  description: precondizione contenente l'hash della risorsa
                  required: true
                  schema:
                      type: string
                - name: cui_uuid
                  in: path
                  description: UUID del CUI
                  required: true
                  schema:
                      type: string
                - name: resource_id
                  in: path
                  description: id risorsa documento
                  required: true
                  schema:
                      type: string

            responses:
                "200":
                    description: risorsa richiesta, codificata in base64, il mime type relativo è specificato nel descrittore dell'istanza
                    content:
                        text/plain:
                            schema:
                                type: string
                                format: byte
                    headers:
                        Agid-JWT-Signature:
                            $ref: "#/components/headers/Agid-JWT-Signature"

                "206":
                    description: porzione di risorsa richiesta, codificata in base64, il mime type relativo è specificato nel descrittore dell'istanza
                    content:
                        text/plain:
                            schema:
                                type: string
                                format: byte
                    headers:
                        Content-Range:
                            description: espressione del range incluso nella risposta
                            schema:
                                type: string
                                example: bytes 21010-47021/47022
                        Agid-JWT-Signature:
                            $ref: "#/components/headers/Agid-JWT-Signature"

                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "412":
                    $ref: "#/components/responses/PreconditionFailed"
                "416":
                    $ref: "#/components/responses/RangeNotSatisfiable"
                "428":
                    $ref: "#/components/responses/PreconditionRequired"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /notify:
        post:
            description: Notifica eventi di processo di una data istanza di procedimento.
            requestBody:
                content:
                    application/json:
                        schema:
                            oneOf:
                                - $ref: "#/components/schemas/NotifyMessage"
                                - $ref: "#/components/schemas/TransferNotifyMessage"
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

    /cdss_resolution_forward:
        post:
            description: Trasferimento della determinazione conclusiva della Conferenza dei servizi sincrona.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            required:	
                                - cui
                                - instance_descriptor_version
                                - cdss_resolution
                            properties:
                              cui:
                                  $ref: "#/components/schemas/cui"
                              instance_descriptor_version:
                                  type: string
                              cdss_resolution:  	
                                  $ref: "#/components/schemas/CdssResolution"
                              outcome:  
                                  type: string
                                  enum: 
                                    - positive_outcome
                                    - negative_outcome
                              date:
                                  title: data di trasferimento della determinazione conclusiva
                                  type: string
                                  format: date
                              additional_document_list:  
                                  type: array
                                  items:
                                      type: object
                                      required:
                                          - resource_id
                                          - filename
                                          - description
                                          - mime_type
                                          - hash
                                          - alg_hash
                                      properties:
                                          resource_id:
                                              title: id della risorsa, univoco per erogatore e CUI.UUID
                                              type: string
                                              minLength: 1
                                          description:                            
                                              title: descrizione della risorsa
                                              type: string
                                              minLength: 1
                                          filename:                      
                                              title: filename della risorsa
                                              type: string
                                              minLength: 1
                                          file_size:
                                              description: dimensione del file
                                              type: integer
                                          mime_type:
                                              title: indica il formato dei dati previsto per il documento
                                              type: string
                                              enum: 
                                              - application/pdf
                                              - application/pkcs7-mime
                                          hash:
                                              title: hash risorsa
                                              type: string
                                              minLength: 1
                                          alg_hash:
                                              title: algoritmo hash applicato
                                              type: string
                                              enum:
                                              - S256
                                              - S384
                                              - S512
                required: true
            responses:
                "200":
                    $ref: "#/components/responses/OKRequest"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/ServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavaliable"

            security:
                - bearerAuth: []
                  Agid-JWT-Signature: []

components:
    responses:
        OKRequest:
            description: Richiesta completata con successo
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        BadRequest:
            description: Forma della richiesta non conforme alla specifica
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        NotFound:
            description: risorsa non trovata
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
        
        Conflict:
            description: conflitto sulla risorsa, la richiesta non può essere elaborata a causa di un conflitto nello stato coerente della risorsa
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
                
        PreconditionFailed:
            description: precondizione fallita, rappresentazione risorsa non correttamente individuata
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
        
        RangeNotSatisfiable:
            description: richiesta di range non soddisfacibile
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
                Content-Range:
                    description: lunghezza attuale della rappresentazione selezionata
                    schema:
                        type: string
                        example: bytes */47022

        PreconditionRequired:
            description: precondizione richiesta, rappresentazione risorsa non correttamente individuata
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        ServiceUnavailable:
            description: Servizio non disponibile
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

        Unauthorized:
            description: Richiesta non autorizzata
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        ServerError:
            description: Errore processamento richiesta
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
            headers:
                Agid-JWT-Signature:
                    $ref: "#/components/headers/Agid-JWT-Signature"

    schemas:
        cui:
            type: object
            description: codice unico dell'istanza
            required:
                - context
                - sub_context
                - data
                - progressive
                - uuid
            properties:
                context:
                    title: contesto dell'istanza
                    type: string

                sub_context:
                    title: Specificità del contesto (es. SUE Produttivo, SUE Residenziale)
                    type: string

                data:
                    title: data emissione cui
                    type: string
                    format: date
                
                progressive:
                    title: numero progressivo a rotazione annuale
                    type: string

                uuid:
                    title: UUID chiave del CUI
                    type: string
                    
        AdministrationSchema:
            description: Amministrazione compentente censita nel Catalogo SSU
            type: object
            required:
                - ipacode
                - officecode
                - version
                - description
            properties:
                ipacode:
                    title: codice IPA dell'amministrazione
                    type: string
                    minLength: 1
                officecode:
                    title: codice dell'ufficio dell'amministrazione 
                    type: string
                    minLength: 1
                version:
                    title: versione dell'ufficio dell'amministrazione 
                    type: string
                    pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"
                description:
                    title: descrizione dell'amministrazione
                    type: string

        Error:
            type: object
            description: codice e descrizione condizione di errore
            properties:
                code:
                    type: string
                message:
                    type: string
            required:
                - code
                - message

        RequestCorrectionRequest:
            type: object
            required:
              - cui
              - instance_descriptor_version
              - correction_list
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                correction_list:
                    type: array
                    items:
                        type: object
                        required:
                            - code
                            - ref
                            - correction_request
                        properties:
                            code:
                                title: codice della fattispecie presente nel Catalogo
                                type: string
                                minLength: 1
                            ref:
                                title: riferimento all'elemento dell'istanza relativo al procedimento
                                type: string
                                minLength: 1
                            correction_request:
                                title: testo regolarizzazione richiesta
                                type: string

        IntegrationRequest:
            type: object
            required:
              - cui
              - instance_descriptor_version
              - integration_list
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                integration_list:
                    type: array
                    items:
                        type: object
                        required:
                            - code
                            - integration_request
                        properties:
                            code:
                                title: codice della fattispecie presente nel Catalogo
                                type: string
                                minLength: 1
                            ref:
                                title: riferimento all'elemento dell'istanza relativo al procedimento (procedimento o allegato)
                                type: string
                                minLength: 1
                            integration_request:
                                title: elenco integrazioni richieste da uno o più enti terzi
                                type: array
                                items:
                                    type: object
                                    properties:
                                        request:
                                            title: testo integrazione richiesta
                                            type: string
                                        requester_administration:
                                            title: amministrazione richiedente
                                            $ref: "#/components/schemas/AdministrationSchema"

                integration_document_list:
                    type: array
                    items:
                        type: object
                        properties:
                            requester_administration:
                                title: amministrazione richiedente
                                $ref: "#/components/schemas/AdministrationSchema"
                            resource_id:
                                title: id della risorsa "documento di richiesta integrazioni", univoco per erogatore e CUI.UUID
                                type: string
                                minLength: 1
                            filename:                      
                                title: filename della risorsa "documento di richiesta integrazioni"
                                type: string
                                minLength: 1
                            file_size:
                                description: Dimensione del file.
                                type: integer
                            mime_type:
                                title: "indica il formato dei dati previsto per il documento di richiesta integrazioni"
                                type: string
                            hash:
                                title: hash risorsa
                                type: string
                                minLength: 1
                            alg_hash:
                                title: algoritmo hash applicato
                                type: string
                                enum:
                                - S256
                                - S384
                                - S512

                integration_synthesis:
                  type: object
                  properties:
                    integration_synthesis_note:
                      title: eventuali note operatore all'integrazione richiesta
                      type: string
                    integration_synthesis_attachment_list:
                      type: array
                      items:
                        type: object
                        properties:
                          resource_id:
                            title: id della risorsa "documento di sintesi alla richiesta integrazioni"
                            type: string
                            minLength: 1
                          filename:
                            title: filename della risorsa "documento di sintesi alla richiesta integrazioni"
                            type: string
                            minLength: 1
                          file_size:
                            description: Dimensione del file.
                            type: integer
                          mime_type:
                            title: "indica il formato dei dati previsto per il documento di sintesi alla richiesta integrazioni"
                            type: string
                          hash:
                            title: hash risorsa
                            type: string
                            minLength: 1
                          alg_hash:
                            title: algoritmo hash applicato
                            type: string
                            enum:
                              - S256
                              - S384
                              - S512

        ConformationRequest:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - expirationDate
                - conformation_list
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                expirationDate:
                        title: data di scadenza concessa al presentatore per inoltrare la documentazione relativa alla richiesta di conformazione
                        type: string
                        format: date
                conformation_list:
                    type: array
                    items:
                        type: object
                        required:
                            - code
                            - conformation_request
                        properties:
                            code:
                                title: codice della fattispecie presente nel Catalogo
                                type: string
                                minLength: 1
                            ref:
                                title: riferimento all'elemento dell'istanza relativo al procedimento (procedimento o allegato)
                                type: string
                                minLength: 1
                            conformation_request:
                                title: elenco conformazioni richieste da uno o più enti terzi
                                type: array
                                items:
                                    type: object
                                    properties:
                                        request:
                                            title: testo conformazione richiesta
                                            type: string
                                        requester_administration:
                                            title: amministrazione richiedente
                                            $ref: "#/components/schemas/AdministrationSchema"
                conformation_document_list:
                    type: array
                    items:
                        type: object
                        properties:
                            requester_administration:
                                title: amministrazione richiedente
                                $ref: "#/components/schemas/AdministrationSchema"
                            resource_id:
                                title: id della risorsa "documento di richiesta conformazione", univoco per erogatore e CUI.UUID
                                type: string
                                minLength: 1
                            filename:                      
                                title: filename della risorsa "documento di richiesta conformazione"
                                type: string
                                minLength: 1
                            mime_type:
                                title: "indica il formato dei dati previsto per il documento di richiesta conformazione"
                                type: string
                                minLength: 1
                            hash:
                                title: hash risorsa
                                type: string
                                minLength: 1
                            alg_hash:
                                title: algoritmo hash applicato
                                type: string
                                enum:
                                - S256
                                - S384
                                - S512
                conformation_synthesis:
                  type: object
                  properties:
                    conformation_synthesis_note:
                      title: eventuali note operatore alla conformazione richiesta
                      type: string
                    conformation_synthesis_attachment_list:
                      type: array
                      items:
                        type: object
                        properties:
                          resource_id:
                            title: id della risorsa "documento di sintesi alla richiesta di conformazione"
                            type: string
                            minLength: 1
                          filename:
                            title: filename della risorsa "documento di sintesi alla richiesta di conformazione"
                            type: string
                            minLength: 1
                          file_size:
                            description: Dimensione del file.
                            type: integer
                          mime_type:
                            title: "indica il formato dei dati previsto per il documento di sintesi alla richiesta di conformazione"
                            type: string
                          hash:
                            title: hash risorsa
                            type: string
                            minLength: 1
                          alg_hash:
                            title: algoritmo hash applicato
                            type: string
                            enum:
                              - S256
                              - S384
                              - S512
        
        NotifyMessage:
            type: object
            required:
                - cui
                - instance_descriptor_version
                - event
            properties:
                cui:
                    $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
                event:
                    type: string
                    enum:
                        - end_by_proceeding_time_expired
                        - integration_response_time_expired
                        - conformation_response_time_expired
                        - end_by_conformation_time_expired
                        - end_by_integration_time_expired
                        - end_by_submitter_cancel_requested
                        - cdss_convened
                        - transferred_instance
                        - end_by_instance_deleted_for_cu_fail_link
                        - end_by_instance_deleted_for_cu_fail_check
                        - cds_istruttoria_convened
                        - cds_decisoria_convened
                        - cds_preliminare_convened
                        - reopen_definitive_provision

        TransferNotifyMessage:
            type: object
            oneOf:
                - $ref: "#/components/schemas/OutcomeMessage"
                - $ref: "#/components/schemas/ImpedimentsMessage"
                - $ref: "#/components/schemas/DefinitiveProvision"
                - $ref: "#/components/schemas/SecondProvisionOutcome"
                - $ref: "#/components/schemas/ConditionalProvisionGranted"
                - $ref: "#/components/schemas/ConditionalProvisionRescinded"
                - $ref: "#/components/schemas/ConditionalProvisionDenied"
                - $ref: "#/components/schemas/GenericCommunication"


        BaseTransferMessage:
            type: object
            required:
               - cui
               - instance_descriptor_version
            properties:
                cui:
                  $ref: "#/components/schemas/cui"
                instance_descriptor_version:
                    type: string
              

        TransferMessage:
            allOf:
              - $ref: "#/components/schemas/BaseTransferMessage"
              - type: object
                required: [event]
                properties:
                    event:
                        type: string
                        enum:
                            - end_by_suspension_requested
                            - end_by_positive_outcome
                            - end_by_negative_outcome
                            - existence_of_impediments
                            - end_by_integration_times_expired
                    resource_id:
                        title: se presente, id della risorsa documento correlata all'evento notificato
                        type: string
                        minLength: 1
                    filename:                      
                        title: filename della risorsa documento correlata all'evento notificato
                        type: string
                        minLength: 1
                    file_size:
                        description: Dimensione del file.
                        type: integer
                    mime_type:
                        type: string
                        enum: 
                            - application/pdf
                            - application/pkcs7-mime
                    hash:
                        title: hash risorsa
                        type: string
                        minLength: 1
                    alg_hash:
                        title: algoritmo hash applicato
                        type: string
                        enum:
                        - S256
                        - S384
                        - S512 
            

        ImpedimentsMessage:
            type: object
            allOf:
                - $ref: "#/components/schemas/TransferMessage"
            properties:
                event:
                    type: string
                    enum:
                        - existence_of_impediments
                expiration_date:
                    type: string
                    description: "data di scadenza concessa al presentatore per inoltrare le osservazioni relative ai motivi ostativi"
                    format: date   

        OutcomeMessage:
            type: object
            allOf:
                - $ref: "#/components/schemas/TransferMessage"
            properties:
                event:
                    type: string
                    enum:
                        - end_by_instance_refused
                        - end_by_suspension_requested
                        - end_by_positive_outcome
                        - end_by_negative_outcome
      
                  
                        
        GenericCommunication:
            type: object
            allOf:
                - $ref: "#/components/schemas/BaseTransferMessage"
                - type: object
                  required: [
