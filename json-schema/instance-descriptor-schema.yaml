definitions: {}
"$schema": http://json-schema.org/draft-07/schema#
"$id": https://agid.gov.it/descrittore_istanza.json
description: descrittore istanza
type: object
required:
- version
- municipality
- usecase_proceedings
- instance_status
- times
- workflow 
properties:
  version:
    "$id": "#root/version"
    title: numero versione del descrittore
    type: integer
  cui:
    "$id": "#root/cui"
    "$ref": https://raw.githubusercontent.com/AgID/specifiche-tecniche-DPR-160-2010/refs/heads/approved02/json-schema/cui-schema.yaml
  municipality:
    "$id": "#root/municipality"
    title: codice istat 6 cifre del comune in cui l'istanza è stata presentata
    type: string
    pattern: "^[0-9]{6}$"
  
  legal_person:
    "$id": "#root/legal_person"
    title: codice fiscale persona giuridica necessario sempre tranne nei flussi previsti tra front office suap e comunica per i quali il codice fiscale non è ancora noto
    type: string
    pattern: "^[0-9]{11}|^[A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$"
  instance_status:
    "$id": "#root/instance_status"
    title: stato dell'istanza
    type: array
    items:
      type: object
      required:
      - state
      - timestamp
      properties:
        state:
          "$id": "#root/instance_status/state"
          title: stato dell'istanza, stato iniziale da impostare in started
          type: string
          enum:
          - started
          - presented
          - correction_requested
          - corrected 
          - refused
          - integration_requested
          - ended_by_integration_times_expired
          - integrated
          - conformation_requested
          - ended_by_conformation_times_expired
          - conformated
          - cdss_convened
          - ended_by_suspension_requested
          - ended_by_proceeding_time_expired
          - ended_by_positive_outcome
          - ended_by_negative_outcome
          - ended_by_submitter_cancel_requested
          - instance_transferred
          
        timestamp:
          "$id": "#root/instance_status/timestamp"
          title: timestamp del cambiamento di stato
          type: string
          format: date-time
  times:
    "$id": "#root/time"
    $ref: https://raw.githubusercontent.com/AgID/specifiche-tecniche-DPR-160-2010/refs/heads/approved02/json-schema/times-schema.yaml  
    
  workflow:
    "$id": "#root/workflow"
    title: workflow del regime amministrativo dell'istanza
    type: object
    
    required:
      - id
      - version

    properties:
      id:
        "$id": "#root/workflow/id"
        title: identificativo univoco del workflow del regime amministrativo
        type: string
        enum:
             - SCIA
             - AUTORIZZAZIONE
             - PROVVEDIMENTO-CONDIZIONATO
             - SCIA-CONDIZIONATA
      version:
        "$id": "#root/workflow/version"
        title: version del workflow del regime amministrativo
        type: string
        pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"
    
  usecase_proceedings:
    "$id": "#root/proceedings"
    title: fattispecie procedimenti avviati
    type: array
    items:
      type: object
      required:
      - code
      - version
      - competent_administration
      - instance
      properties:
        code:
          "$id": "#root/usecase_proceedings/code"
          title: codice della fattispecie presente nel Catalogo
          type: string
          minLength: 1
        version:
          "$id": "#root/usecase_proceedings/version"
          title: versione della fattispecie presente nel Catalogo
          type: string
          minLength: 1
        competent_administration:
          "$id": "#root/usecase_proceedings/competent_administration"
          title: amministrazione competente del procedimento
          $ref: https://raw.githubusercontent.com/AgID/specifiche-tecniche-DPR-160-2010/refs/heads/approved02/json-schema/administration-schema.yaml
        interested_administration:                
          title: amministrazione interessata al procedimento
          $ref: "#/components/schemas/InterestedAdministrationSchema"
        interested_administration_fiscal_code:                
          title: amministrazione ghost interessata al procedimento
          $ref: "#/components/schemas/InterestedAdministrationCFSchema"

        form:
          "$id": "#root/usecase_proceedings/form"
          title: riferimento agli oggetti per la validazione
          type: object
          required:
          - xsd
          properties:
            xsd:
              "$id": "#root/usecase_proceedings/form/xsd"
              title: xsd per la validazione
              type: object
              required:
              - code
              - version
              properties:
                code:
                  "$id": "#root/usecase_proceedings/form/xsd/code"
                  title: codice dell'XSD per la validazione
                  type: string
                  minLength: 1
                version:
                  "$id": "#root/usecase_proceedings/version"
                  title: versione dell'XSD per la validazione
                  type: string
                  minLength: 1
            schematron:
              "$id": "#root/usecase_proceedings/form/xsd"
              title: schematron per la validazione
              type: object
              required:
              - code
              - version
              - phase
              properties:
                code:
                  "$id": "#root/usecase_proceedings/form/schematron/code"
                  title: codice dello schematron per la validazione
                  type: string
                  minLength: 1
                version:
                  "$id": "#root/usecase_proceedings/form/schematron/version"
                  title: versione dello schematron per la validazione
                  type: string
                  minLength: 1
                phase:
                  "$id": "#root/usecase_proceedings/form/schematron/phase"
                  title: fasi dello schematron per la validazione
                  type: array
                  items:
                    type: string
        instance:
          "$id": "#root/usecase_proceedings/instance"
          title: porzione istanza relativa al procedimento
          type: object
          required:
          - ref
          - hash
          - alg_hash
          properties:
            ref:
              "$id": "#root/usecase_proceedings/instance/ref"
              title: riferimento all'elemento dell'istanza relativo al procedimento
              type: string
              minLength: 1
            filename:
                "$id": "#root/usecase_proceedings/attachments/filename"
                title: filename dell'istanza
                type: string
                minLength: 1
            hash:
              "$id": "#root/usecase_proceedings/instance/hash"
              title: hash dell'istanza relativo al procedimento
              type: string
              minLength: 1
            alg_hash:
              "$id": "#root/usecase_proceedings/instance/alg_hash"
              title: algoritmo hash dell'istanza relativo al procedimento
              type: string
              enum:
              - S256
              - S384
              - S512
            mime_type:
              type: string
              enum: 
                 - application/xml
                 - application/pkcs7-mime
            activity_model: 
               title: porzione distinta modello attivita
               type: object
               properties:
                  ref:                    
                    title: distinta modello attivita
                    type: string
                    minLength: 1
                  filename:                      
                      title: filename del modello distinta attivita
                      type: string
                      minLength: 1
                  hash:                    
                    title: hash del modello distinta attivita
                    type: string
                    minLength: 1
                  alg_hash:                    
                    title: algoritmo hash del modello distinta attivita
                    type: string
                    enum:
                    - S256
                    - S384
                    - S512
                  mime_type:
                    type: string
                    enum: 
                       - application/pdf
                       - application/pkcs7-mime
        attachments:
          "$id": "#root/usecase_proceedings/attachments"
          title: allegati all'istanza relativi al procedimento
          type: array
          items:
            type: object
            required:
            - ref
            - hash
            - alg_hash
            - mime_type
            properties:

              ref:
                "$id": "#root/usecase_proceedings/attachments/ref"
                title: riferimento all'allegato dell'istanza relativo al procedimento
                type: string
                minLength: 1
              filename:
                "$id": "#root/usecase_proceedings/attachments/filename"
                title: filename dell'allegato
                type: string
                minLength: 1
              file_size:
                description: dimensione del file.
                type: integer
              hash:
                "$id": "#root/usecase_proceedings/attachments/hash"
                title: hash dell'allegato
                type: string
                minLength: 1
              alg_hash:
                "$id": "#root/usecase_proceedings/attachments/alg_hash"
                title: algoritmo hash dell'allegato 
                type: string
                enum:
                - S256
                - S384
                - S512
              attach_code:
                "$id": "#root/usecase_proceedings/attachments/code"
                title: identificativo dell'allegato presente nel Catalogo
                type: string
                minLength: 1
              attach_version:
                "$id": "#root/usecase_proceedings/attachments/version"
                title: versione dell'allegato presente nel Catalogo
                type: string
                minLength: 1
              form:
                "$id": "root/usecase_proceedings/attachments/form"
                title: riferimento agli oggetti per la validazione
                type: object
                required:
                - xsd                
                properties:
                  xsd:
                    "$id": "#root/usecase_proceedings/form/xsd"
                    title: xsd per la validazione
                    type: object
                    required:
                    - code
                    - version
                    properties:
                      code:
                        "$id": "#root/usecase_proceedings/form/xsd/code"
                        title: codice dell'XSD per la validazione
                        type: string
                        minLength: 1
                      version:
                        "$id": "#root/usecase_proceedings/version"
                        title: versione dell'XSD per la validazione
                        type: string
                        minLength: 1
                  schematron:
                    "$id": "#root/usecase_proceedings/form/xsd"
                    title: schematron per la validazione
                    type: object
                    required:
                    - code
                    - version
                    - phase
                    properties:
                      code:
                        "$id": "#root/usecase_proceedings/form/schematron/code"
                        title: codice dello schematron per la validazione
                        type: string
                        minLength: 1
                      version:
                        "$id": "#root/usecase_proceedings/form/schematron/version"
                        title: versione dello schematron per la validazione
                        type: string
                        minLength: 1
                      phase:
                        "$id": "#root/usecase_proceedings/form/schematron/phase"
                        title: fasi dello schematron per la validazione
                        type: array
                        items:
                          type: string
              mime_type:
                type: string

        free_attachments:
          title: allegati liberi non mappati sul Catalogo, relativi alla fattispecie
          type: array
          items:
            type: object
            required:
            - ref
            - hash
            - alg_hash
            - mime_type
            properties:
              ref:
                "$id": "#root/usecase_proceedings/attachments/ref"
                title: riferimento dell'allegato
                type: string
                minLength: 1
              filename:
                "$id": "#root/usecase_proceedings/attachments/filename"
                title: filename dell'allegato
                type: string
                minLength: 1
              file_size:
                description: dimensione del file
                type: integer
              hash:
                "$id": "#root/usecase_proceedings/attachments/hash"
                title: hash dell'allegato
                type: string
                minLength: 1
              alg_hash:
                "$id": "#root/usecase_proceedings/attachments/alg_hash"
                title: algoritmo hash dell'allegato 
                type: string
                enum:
                - S256
                - S384
                - S512
              mime_type:
                type: string

  InterestedAdministrationSchema:
    description: Un array di amministrazioni competenti.
    type: array
    items:
      type: object
      description: Amministrazione competente censita nel Catalogo SSU
      required:
        - description
        - ipacode
        - officecode
        - id
      properties:
        ipacode:
          title: codice IPA dell'amministrazione
          type: string
          minLength: 1
        officecode:
          title: codice dell'ufficio dell'amministrazione
          type: string
          minLength: 1
        version:
          title: versione dell'ufficio dell'amministrazione valorizzata solo se non è un amministrazione GHOST
          type: string
          pattern: "[0-9]{2}.[0-9]{2}.[0-9]{2}"      
        description:
          title: descrizione dell'amministrazione
          type: string
        id:
          title: identificativo dell'amministrazione
          type: string
          minLength: 1                                            
  InterestedAdministrationCFSchema:
    description: Un array di amministrazioni competenti non censite su ipa.
    type: array
    items:
      type: object
      description: Amministrazione competente censita nel Catalogo SSU
      properties:
        fiscal_code:
          title: codice fiscale  dell'amministrazione non presente su IPA
          type: string
          minLength: 1
        description:
          title: descrizione dell'amministrazione
          type: string
        id:
          title: identificativo dell'amministrazione
          type: string
          minLength: 1                                  